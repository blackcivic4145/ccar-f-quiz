<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>CCAR-F 模擬問題集</title>
<style>
  body { font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; color: #222; background: #fafafa; }
  h1 { font-size: 1.3em; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 24px; margin-top: 16px; }
  .domain { color: #666; font-style: italic; margin-bottom: 4px; }
  .progress { color: #444; margin-bottom: 4px; }
  .qtext { font-weight: bold; font-size: 1.05em; margin: 12px 0 16px; white-space: pre-wrap; }
  label.choice { display: block; padding: 8px 10px; margin: 6px 0; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; }
  label.choice:hover { background: #f0f4ff; }
  label.choice.correct { background: #e6f4ea; border-color: #34a853; }
  label.choice.wrong { background: #fce8e6; border-color: #ea4335; }
  input[type=radio] { margin-right: 8px; }
  button { padding: 8px 18px; margin-top: 12px; margin-right: 8px; border-radius: 6px; border: 1px solid #888; background: #f5f5f5; cursor: pointer; font-size: 0.95em; }
  button:disabled { opacity: 0.5; cursor: default; }
  button.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  .feedback { margin-top: 14px; padding: 10px 12px; border-radius: 6px; white-space: pre-wrap; }
  .feedback.correct { background: #e6f4ea; }
  .feedback.wrong { background: #fce8e6; }
  .row { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
  .stats { line-height: 1.7; }
  .missed { margin-top: 16px; }
  .missed .item { padding: 8px 0; border-top: 1px solid #eee; }
  .hidden { display: none; }
  #resultSummary { font-size: 1.2em; font-weight: bold; }
  .titlebar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .lang-switch { display: flex; gap: 6px; flex-shrink: 0; }
  .lang-switch button { margin: 0; padding: 6px 12px; font-size: 0.85em; }
  .lang-switch button.active { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  #diagramBox { margin-top: 12px; border: 1px solid #ddd; border-radius: 6px; background: #fff; overflow-x: auto; }
</style>
</head>
<body>

<div class="titlebar">
  <h1 id="pageTitle">CCAR-F (Claude Certified Architect - Foundations) 模擬問題集</h1>
  <div class="lang-switch">
    <button type="button" id="langJaBtn" class="active">日本語</button>
    <button type="button" id="langEnBtn">English</button>
  </div>
</div>

<div id="startCard" class="card">
  <p id="introText">全 <span id="totalCount"></span> 問収録。出題数を選んで開始してください（各ドメインの出題比率を維持したままランダム抽出されます）。</p>
  <p id="scopeText" style="color:#666; font-size:0.9em;"></p>
  <p id="timeLimitText" style="color:#666; font-size:0.9em;"></p>
  <div class="row">
    <label for="countInput" id="countLabel">出題数:</label>
    <input type="number" id="countInput" min="1" value="60">
  </div>
  <button class="primary" id="startBtn">開始する</button>
</div>

<div id="questionCard" class="card hidden">
  <div class="progress" id="progress"></div>
  <div class="domain" id="domainLabel"></div>
  <div class="progress" id="timerLabel" style="font-weight:bold;"></div>
  <div class="qtext" id="qtext"></div>
  <div id="choices"></div>
  <div>
    <button type="button" id="hintBtn" class="hidden">💡 図解のヒントを見る</button>
  </div>
  <div class="feedback hidden" id="feedback"></div>
  <div id="diagramBox" class="hidden"></div>
  <button class="primary" id="answerBtn">回答する</button>
  <button id="nextBtn" disabled>次へ</button>
</div>

<div id="resultCard" class="card hidden">
  <div id="resultSummary"></div>
  <div class="stats" id="domainStats"></div>
  <div class="missed" id="missedList"></div>
  <button class="primary" id="retryBtn">もう一度挑戦する</button>
</div>

<script>
const QUESTIONS_JA = [
{domain:"アジェンティック・アーキテクチャ",text:"マルチエージェント構成において、オーケストレーター（親）エージェントとサブエージェントを分離する主な利点は何か？",choices:["コンテキストウィンドウを汚染せずに専門タスクを並列実行できる","サブエージェントは常に親より高性能なモデルを使う","サブエージェントはツールを一切使えなくなる","API呼び出し回数を必ず削減できる"],correct:0,explanation:"サブエージェントは独立したコンテキストで動作するため、親エージェントの会話コンテキストを圧迫せずに専門化されたタスクを処理できる。",diagram:"orchestrator_worker"},
{domain:"アジェンティック・アーキテクチャ",text:"エージェントが「計画→実行→検証」のループを繰り返すアーキテクチャは一般に何と呼ばれるか？",choices:["ReActパターン","シングルショット推論","静的パイプライン","バッチ処理"],correct:0,explanation:"ReAct（Reasoning + Acting）は推論と行動を交互に繰り返しながらタスクを進めるエージェントパターン。",diagram:"react_loop"},
{domain:"アジェンティック・アーキテクチャ",text:"長時間稼働するエージェントタスクにおいて、サブタスクを並列化することの主なリスクは何か？",choices:["共有リソースやファイルへの競合（レースコンディション）が発生しうる","トークン消費が必ず減る","レイテンシが必ず増加する","ツール呼び出しが禁止される"],correct:0,explanation:"並列実行では複数のタスクが同じリソースに同時アクセスすることで競合が発生する可能性があり、設計上の考慮が必要になる。",diagram:"parallelization"},
{domain:"アジェンティック・アーキテクチャ",text:"エージェントに「ツールを使うべきかどうか」を判断させる設計上、最も重要な要素はどれか？",choices:["各ツールの説明（description）が目的と使用条件を明確に記述していること","ツール名をすべて英語にすること","ツールの数をできるだけ増やすこと","ツールのレスポンスを常にXML形式にすること"],correct:0,explanation:"モデルはツールの説明文をもとに使用可否を判断するため、説明が曖昧だと誤ったツール選択につながる。",diagram:"tool_call_flow"},
{domain:"アジェンティック・アーキテクチャ",text:"オーケストレーター・ワーカーパターンにおいて、オーケストレーターの主な責務は何か？",choices:["タスクをサブタスクに分解し、ワーカーに割り当て、結果を統合する","すべてのAPIキーを管理する","UIの描画を行う","モデルの重みを更新する"],correct:0,explanation:"オーケストレーターはタスク分解と結果統合という調整役を担う中心的なコンポーネントである。",diagram:"orchestrator_worker"},
{domain:"アジェンティック・アーキテクチャ",text:"評価者（evaluator）エージェントを組み込む目的として最も適切なのはどれか？",choices:["生成された出力の品質をチェックし、必要に応じて再実行を促す","ユーザー入力を暗号化する","トークン数を自動的にゼロにする","モデルのファインチューニングを行う"],correct:0,explanation:"Evaluator-optimizerパターンでは、評価者が出力を検証し基準を満たすまで生成と評価を繰り返す。",diagram:"evaluator_optimizer"},
{domain:"アジェンティック・アーキテクチャ",text:"エージェントの自律性を高める際、安全性を担保するために一般的に導入されるべき仕組みはどれか？",choices:["破壊的操作の前に人間の承認を要求するチェックポイント","すべてのツールを無条件で自動実行する","ログを一切残さない","コンテキストウィンドウを無制限にする"],correct:0,explanation:"不可逆的・破壊的な操作の前に人間の確認を挟むことで、自律エージェントの暴走リスクを低減できる。",diagram:"human_in_the_loop"},
{domain:"アジェンティック・アーキテクチャ",text:"「オーケストレーター-ワーカー」型と「並列化（parallelization）」型のワークフローの違いとして正しいものはどれか？",choices:["並列化は事前に固定されたサブタスクを同時実行するが、オーケストレーターは実行時に動的にサブタスクを決定する","並列化は必ず1つのモデル呼び出しで完結する","オーケストレーター型はツールを使用できない","両者に違いはない"],correct:0,explanation:"並列化パターンは事前に決められた複数タスクを並行実行するのに対し、オーケストレーター型は実行時に動的にサブタスクを決定する柔軟性を持つ。",diagram:"orchestrator_worker"},
{domain:"アジェンティック・アーキテクチャ",text:"エージェントのワークフローにおける「ルーティング（routing）」パターンの目的は何か？",choices:["入力内容を分類し、最適な専用プロンプトやモデルに振り分ける","すべての入力を同一のプロンプトで処理する","トークン使用量を無視する","常に人間にエスカレーションする"],correct:0,explanation:"ルーティングは入力を分類し、それぞれに最適化された処理経路へ振り分けることで精度と効率を高める。",diagram:"routing"},
{domain:"アジェンティック・アーキテクチャ",text:"「Prompt chaining（プロンプトチェイニング）」ワークフローが適しているのはどのような場合か？",choices:["タスクを明確な逐次ステップに分解でき、各ステップの出力を検証してから次に進める場合","単一の非常に単純な分類タスクの場合のみ","並列実行が不可能な場合","モデルが画像を生成する場合のみ"],correct:0,explanation:"プロンプトチェイニングは、タスクを順序立てたサブステップに分解し各段階を検証できる場合に有効なワークフローである。",diagram:"prompt_chaining"},
{domain:"アジェンティック・アーキテクチャ",text:"エージェント的ワークフローとシンプルなプロンプト+LLM呼び出しを比較したとき、エージェント的アプローチを採用すべき典型的な状況は？",choices:["タスクが複雑でオープンエンドであり、事前にステップ数を予測できない場合","タスクが単純で決まった手順しかない場合","レイテンシが最優先で他は考慮しない場合","常にコストを最小化したい場合"],correct:0,explanation:"事前にステップ数や手順が予測できない複雑なタスクでは、動的に判断しながら進めるエージェント的アプローチが適している。",diagram:"orchestrator_worker"},
{domain:"Claude Code設定・ワークフロー",text:"Claude Codeにおいて、リポジトリ固有の指示やコーディング規約をClaudeに与えるための標準ファイルはどれか？",choices:["CLAUDE.md","package.json",".gitignore","README.txt"],correct:0,explanation:"CLAUDE.mdはプロジェクト固有のコンテキストや指示をClaude Codeに伝えるための標準的なファイルである。",diagram:"claude_code_config"},
{domain:"Claude Code設定・ワークフロー",text:"Claude Codeの「hooks」機能の主な用途はどれか？",choices:["特定のイベント（ツール実行前後など）に応じて自動的にシェルコマンドを実行する","モデルの重みを直接編集する","UIのテーマを変更する","ネットワーク帯域を制限する"],correct:0,explanation:"hooksはツール実行前後などの特定イベントに応じて任意のシェルコマンドを自動実行する仕組みである。",diagram:"permission_hooks"},
{domain:"Claude Code設定・ワークフロー",text:"Claude Codeでカスタムのスラッシュコマンドを追加したい場合、どこにMarkdownファイルを配置するのが一般的か？",choices:[".claude/commands/ ディレクトリ","node_modules/ ディレクトリ","システムのルートディレクトリ",".git/hooks/ ディレクトリ"],correct:0,explanation:".claude/commands/ 配下にMarkdownファイルを置くことで、独自のスラッシュコマンドを定義できる。",diagram:"claude_code_config"},
{domain:"Claude Code設定・ワークフロー",text:"Claude CodeでMCPサーバーをプロジェクトに接続する設定は主にどこで管理されるか？",choices:[".mcp.json またはClaude Codeの設定ファイル","Dockerfile","tsconfig.json",".eslintrc"],correct:0,explanation:"MCPサーバーの接続情報は.mcp.jsonなどの専用設定ファイルで管理される。",diagram:"mcp_architecture"},
{domain:"Claude Code設定・ワークフロー",text:"Claude Codeの権限モード（permission mode）を制限する目的として最も適切なのはどれか？",choices:["危険なコマンドやファイル操作が実行される前にユーザーの承認を求める","モデルの応答速度を上げる","トークン価格を下げる","コンテキストウィンドウを拡張する"],correct:0,explanation:"権限モードは、破壊的・不可逆的な操作が行われる前にユーザーの確認を挟むための安全機構である。",diagram:"permission_hooks"},
{domain:"Claude Code設定・ワークフロー",text:"サブエージェント（subagent）をClaude Codeで定義する際、一般的にどのような情報をfrontmatterに記述するか？",choices:["名前、説明、使用可能なツール","データベースのスキーマ","CSSのスタイル定義","DNSレコード"],correct:0,explanation:"サブエージェント定義のfrontmatterには名前・説明・利用可能ツールなどのメタ情報を記述する。",diagram:"subagent_isolation"},
{domain:"Claude Code設定・ワークフロー",text:"Claude Codeで「プランモード」を使う主な目的は何か？",choices:["コードを変更する前に実装方針をレビューし、合意を得てから実行に移る","すべてのファイルを自動的に削除する","テストを無効化する","Gitの履歴を書き換える"],correct:0,explanation:"プランモードは実装に着手する前に方針をユーザーと合意するための機能であり、意図しない変更を防ぐ。",diagram:"permission_hooks"},
{domain:"Claude Code設定・ワークフロー",text:"Claude CodeにおいてMEMORY.mdやメモリファイルを使う目的として適切なのはどれか？",choices:["セッションをまたいでユーザーの好みやプロジェクトの背景を永続的に記録する","一時的なデバッグ出力を保存するためだけに使う","APIキーを保存する","ソースコードの代わりに使う"],correct:0,explanation:"メモリファイルは会話セッションをまたいで再利用したい知識や好みを永続化するための仕組みである。",diagram:"claude_code_config"},
{domain:"プロンプトエンジニアリング・構造化出力",text:"モデルに厳密なJSON形式で出力させたい場合、最も効果的な指示方法はどれか？",choices:["期待する出力のスキーマや具体例を明示し、余分なテキストを含めないよう明確に指示する","何も指示せずモデルの判断に任せる","出力形式について一切触れない","常に自然文で応答させる"],correct:0,explanation:"出力スキーマや具体例を明示することで、モデルが期待通りの構造化出力を返す精度が高まる。",diagram:"structured_output_schema"},
{domain:"プロンプトエンジニアリング・構造化出力",text:"システムプロンプトとユーザープロンプトの役割の違いとして正しいものはどれか？",choices:["システムプロンプトはモデルの全体的な振る舞いや役割を設定し、ユーザープロンプトは個別のリクエストを伝える","両者は完全に同じ役割を持つ","システムプロンプトは画像入力にのみ使われる","ユーザープロンプトはモデルの重みを変更する"],correct:0,explanation:"システムプロンプトは全体的な役割・振る舞いの設定に使われ、ユーザープロンプトは個々のリクエスト内容を伝える。",diagram:"system_vs_user_prompt"},
{domain:"プロンプトエンジニアリング・構造化出力",text:"Few-shot（少数例）プロンプティングの利点は何か？",choices:["期待する出力形式やスタイルを具体例で示すことで精度を高められる","トークン数を必ずゼロにできる","モデルのファインチューニングと同義である","常にレイテンシを短縮する"],correct:0,explanation:"少数の具体例を示すことで、モデルが期待する出力形式やスタイルを学習しやすくなる。",diagram:"structured_output_schema"},
{domain:"プロンプトエンジニアリング・構造化出力",text:"XMLタグ（例: <thinking>や<answer>）を使ってプロンプトを構造化する主な利点はどれか？",choices:["モデルが指示内容と出力箇所を明確に区別しやすくなる","トークンを消費しなくなる","モデルが画像を生成できるようになる","APIレスポンスの暗号化に必要である"],correct:0,explanation:"XMLタグを用いることでプロンプト内の指示・例・出力領域を明確に区切ることができ、モデルの理解精度が向上する。",diagram:"structured_output_schema"},
{domain:"プロンプトエンジニアリング・構造化出力",text:"「chain-of-thought（思考の連鎖）」プロンプティングが有効なのはどのような場合か？",choices:["複雑な推論や多段階の計算を要するタスク","単純な単語の翻訳のみのタスク","画像フォーマットの変換のみのタスク","常にすべてのタスクで無効である"],correct:0,explanation:"複雑な推論や多段階の計算を要するタスクでは、途中の思考過程を明示させることで精度が向上しやすい。",diagram:"structured_output_schema"},
{domain:"プロンプトエンジニアリング・構造化出力",text:"プロンプトで出力の一貫性を高めるために「negative instruction（禁止事項）」よりも推奨される手法はどれか？",choices:["望ましい振る舞いを肯定形で具体的に指示する","何も指示しない","禁止事項だけを羅列する","出力例を一切示さない"],correct:0,explanation:"「〜するな」という否定的指示よりも「〜せよ」という肯定的で具体的な指示の方がモデルは従いやすい。",diagram:"structured_output_schema"},
{domain:"プロンプトエンジニアリング・構造化出力",text:"構造化出力を得るためにTool useの「入力スキーマ」を使う利点は何か？",choices:["モデルの出力を事前定義したJSONスキーマに強制的に整合させやすい","モデルが画像しか出力できなくなる","レイテンシが必ずゼロになる","ツールを使うとプロンプトが不要になる"],correct:0,explanation:"Tool useの入力スキーマを利用すると、モデルの出力を定義済みの構造に沿わせやすくなり、パースの信頼性が向上する。",diagram:"structured_output_schema"},
{domain:"プロンプトエンジニアリング・構造化出力",text:"長いコンテキストを扱う際、重要な指示をプロンプトの末尾近くに置くことが推奨される理由は何か？",choices:["一般にモデルは直近の指示に強く注意を向けやすいため","先頭の情報は自動的に破棄されるため","末尾に置かないとAPIがエラーを返すため","理由は特にない"],correct:0,explanation:"長いコンテキストでは、末尾に近い指示ほどモデルが注意を向けやすい傾向があるため、重要な指示は末尾付近に配置することが推奨される。",diagram:"structured_output_schema"},
{domain:"ツール設計・MCP統合",text:"MCP（Model Context Protocol）の主な目的は何か？",choices:["LLMアプリケーションと外部データソース・ツールを標準化された方法で接続する","モデルの学習データを暗号化する","GPUのメモリ使用量を最適化する","UIのレンダリングを高速化する"],correct:0,explanation:"MCPはLLMアプリケーションが外部のデータソースやツールに標準化された方法で接続するためのオープンプロトコルである。",diagram:"mcp_architecture"},
{domain:"ツール設計・MCP統合",text:"MCPサーバーが提供できるプリミティブとして代表的でないものはどれか？",choices:["Resources、Tools、Promptsのいずれか","ニューラルネットワークの重み更新","Resources","Tools"],correct:1,explanation:"MCPサーバーはResources、Tools、Promptsなどのプリミティブを提供するが、モデルの重み更新は対象ではない。",diagram:"mcp_architecture"},
{domain:"ツール設計・MCP統合",text:"ツール（関数）の説明文（description）を書く際のベストプラクティスはどれか？",choices:["いつ・なぜそのツールを使うべきかを具体的かつ明確に記述する","できるだけ曖昧にしてモデルの自由度を高める","説明を省略し名前だけで判断させる","他のツールと重複する説明を避けずそのまま流用する"],correct:0,explanation:"ツールの説明文は使用条件や目的を具体的に記述することで、モデルが適切にツールを選択・利用できるようになる。",diagram:"tool_call_flow"},
{domain:"ツール設計・MCP統合",text:"複数のツールが似た機能を持つ場合に起こりやすい問題はどれか？",choices:["モデルがどのツールを選ぶべきか混乱し、誤った呼び出しをする可能性が高まる","常にレイテンシが短縮される","トークン消費が必ずゼロになる","問題は一切発生しない"],correct:0,explanation:"機能が重複するツールが多いと、モデルが適切なツールを選択しづらくなり誤呼び出しのリスクが高まる。",diagram:"tool_call_flow"},

{domain:"コンテキスト管理・信頼性",text:"モデルの出力に対して定期的に人間によるサンプリングレビューを行うことの利点は？",choices:["自動評価だけでは見逃されがちな品質劣化や偏りを発見できる","人間のレビューは自動評価より常に精度が低い","サンプリングレビューはコストの無駄でしかない","人間のレビューはモデルの挙動に一切影響しない"],correct:0,explanation:"定期的な人間によるサンプリングレビューにより、自動評価だけでは見逃されがちな品質劣化や偏りを発見できる。",diagram:"context_compaction"},
{domain:"コンテキスト管理・信頼性",text:"複数の情報源から矛盾する情報が得られた場合に、エージェントがそのまま片方を採用せず矛盾を明示する設計の利点は？",choices:["ユーザーが誤った情報に基づいて判断してしまうリスクを減らせる","矛盾を無視して片方を採用する方が常に信頼性が高い","矛盾の明示はコンテキスト管理とは無関係な機能である","矛盾があった場合は常に処理を停止しなければならない"],correct:0,explanation:"矛盾する情報を明示することで、ユーザーが誤った情報のみに基づいて判断してしまうリスクを減らせる。",diagram:"context_compaction"},
{domain:"コンテキスト管理・信頼性",text:"システムの信頼性を継続的に改善するために、実運用でのエラーログや失敗事例を定期的に分析することの利点は？",choices:["繰り返し発生する問題パターンを特定し、設計やプロンプトの改善につなげられる","エラーログの分析は運用コストを増やすだけで改善には寄与しない","失敗事例の分析は信頼性向上と無関係である","エラーログは分析せずに破棄するのがベストプラクティスである"],correct:0,explanation:"実運用でのエラーログや失敗事例を定期的に分析することで、繰り返し発生する問題パターンを特定し、設計やプロンプトの改善につなげられる。",diagram:"tool_call_flow"},
{domain:"アジェンティック・アーキテクチャ",text:"カスタマーサポート向けエージェントで、特定のカテゴリ（返金・法的請求など）を必ず人間のオペレーターにエスカレーションさせる設計が重要な理由は？",choices:["コンプライアンス上の要件やリスクの高い判断を、権限を持つ人間に委ねる必要があるため","エスカレーションを設けると必ず顧客満足度が下がるため","すべての判断はエージェントに任せる方が常に安全であるため","エスカレーションの仕組みはMCPの仕様に含まれないため実装不可能"],correct:0,explanation:"返金や法的請求のようなコンプライアンス上重要なカテゴリは、権限を持つ人間に判断を委ねる必要があるため、必ずエスカレーションさせる設計が重要である。",diagram:"human_in_the_loop"},
{domain:"アジェンティック・アーキテクチャ",text:"カスタマーサポートエージェントが、社内ポリシー上「返金は50ドルまで自動承認可」のようなルールを厳格に強制する設計が重要な理由は？",choices:["ポリシー違反となる不正な処理をエージェントが独断で実行してしまうリスクを防ぐため","ルールを強制するとエージェントの応答が必ず遅くなるため","ポリシーの強制はコンプライアンスと無関係である","ルールを設けるとエージェントが動作しなくなる"],correct:0,explanation:"金額上限などのポリシーを厳格に強制することで、エージェントが独断でポリシー違反の処理を実行してしまうリスクを防げる。",diagram:"permission_hooks"},
{domain:"アジェンティック・アーキテクチャ",text:"マルチエージェントワークフローにおいて、あるエージェントの出力が別のエージェントの入力になる場合、出力の「出所（provenance）」を記録しておくことの利点は？",choices:["誤った結果が生じた際に、どのエージェント・どの処理ステップに起因するかを追跡しやすくなる","出所を記録すると必ず処理速度が低下するだけで利点はない","出所の記録はセキュリティ上禁止されている","出所を記録すると結果が自動的に正確になる"],correct:0,explanation:"各出力の出所を記録しておくことで、誤った結果が生じた際にどのエージェント・どのステップに起因するかを追跡しやすくなる。",diagram:"orchestrator_worker"},
{domain:"アジェンティック・アーキテクチャ",text:"サービスが一時的に利用不可な依存先を含むエージェントワークフローで、「機能を縮退させつつ運用を継続する（グレースフルデグラデーション）」設計と、「即座に処理を全停止する」設計を比較したとき、前者が有効な場面は？",choices:["一部機能が使えなくても、他の重要な機能をユーザーに提供し続けたい場合","どんな障害でも常に即座に全停止すべきであるため前者は不要","グレースフルデグラデーションは技術的に実現不可能である","縮退運用は常にセキュリティリスクを高めるだけである"],correct:0,explanation:"一部機能が使えない状況でも他の重要な機能を提供し続けたい場合には、機能を縮退させつつ運用を継続する設計が有効である。",diagram:"orchestrator_worker"},
{domain:"アジェンティック・アーキテクチャ",text:"カスタマーサポートエージェントから人間のオペレーターへ「ハンドオフ（引き継ぎ）」する際、それまでの会話の要約や実行済みアクションの記録を添えて渡すことの利点は？",choices:["人間のオペレーターが一から状況を把握する手間を省き、迅速かつ一貫した対応ができる","要約を添えると引き継ぎができなくなる","記録を渡すことは個人情報保護の観点から常に禁止されている","ハンドオフに情報を添えても対応品質には影響しない"],correct:0,explanation:"会話の要約や実行済みアクションを添えて引き継ぐことで、人間のオペレーターが状況を一から把握する手間を省き、迅速かつ一貫した対応ができる。",diagram:"human_in_the_loop"},
{domain:"アジェンティック・アーキテクチャ",text:"「Orchestrator-workers」パターンにおいて、オーケストレーターがワーカーに割り当てるサブタスクを実行時に動的に決定する（事前に固定しない）ことの利点は？",choices:["入力内容に応じて必要なサブタスクの数や種類を柔軟に調整できる","動的決定にすると必ず処理が遅くなるだけで利点はない","事前に固定する方が常にあらゆる状況に対応できる","動的決定はオーケストレーターパターンの定義に反する"],correct:0,explanation:"サブタスクを実行時に動的に決定することで、入力内容に応じて必要なサブタスクの数や種類を柔軟に調整できる。",diagram:"orchestrator_worker"},
{domain:"アジェンティック・アーキテクチャ",text:"マルチエージェントの研究支援ワークフロー（複数のリサーチエージェントが情報収集し、1つの統合エージェントがまとめる）において、各リサーチエージェントの出力形式を統一しておくべき理由は？",choices:["統合エージェントが複数の出力を一貫した方法でマージ・比較しやすくなるため","出力形式を統一すると各リサーチエージェントの独自性が失われるため避けるべき","統合処理は出力形式に依存しないため統一は不要","出力形式の統一はMCPでは扱えない概念である"],correct:0,explanation:"各リサーチエージェントの出力形式を統一しておくことで、統合エージェントが複数の出力を一貫した方法でマージ・比較しやすくなる。",diagram:"orchestrator_worker"},
{domain:"アジェンティック・アーキテクチャ",text:"エージェントワークフローの設計において、「この処理はエージェントに任せず、決定論的なルールベースのロジックにすべきか」を判断する基準として最も適切なのは？",choices:["判断が明確なルールで表現でき、常に同じ結果が期待される処理かどうか","処理内容にかかわらず常にLLMに任せるべきである","ルールベースのロジックはエージェントシステムでは使用できない","判断基準は存在せず、常にランダムに決めてよい"],correct:0,explanation:"判断が明確なルールで表現でき常に同じ結果が期待される処理かどうかが、決定論的なロジックに任せるべきかの判断基準となる。",diagram:"orchestrator_worker"},
{domain:"アジェンティック・アーキテクチャ",text:"カスタマーサポートエージェントが、ユーザーの本人確認が取れていない状態で機密性の高い情報（注文履歴など）を開示しないよう制御する設計は、どのパターンに分類されるか？",choices:["ガードレール（コンプライアンス制御）を伴うエージェントワークフロー設計","並列化パターン","プロンプトチェイニングとは無関係の概念","MCPのResourcesプリミティブの一種"],correct:0,explanation:"本人確認前に機密情報を開示しないよう制御する設計は、ガードレール（コンプライアンス制御）を伴うエージェントワークフロー設計に分類される。",diagram:"orchestrator_worker"},
{domain:"アジェンティック・アーキテクチャ",text:"マルチエージェントシステムにおいて、1つのエージェントの失敗が他のエージェント全体の処理を止めてしまわないよう設計する（部分的な失敗を許容する）ことの利点は？",choices:["システム全体の可用性を高め、限定的な障害の影響範囲を抑えられる","部分的な失敗を許容すると必ずデータが破損する","1つでも失敗したら全体を止める設計の方が常に優れている","失敗の許容はエージェント設計と無関係である"],correct:0,explanation:"部分的な失敗を許容する設計にすることで、システム全体の可用性を高め、限定的な障害の影響範囲を抑えられる。",diagram:"orchestrator_worker"},
{domain:"アジェンティック・アーキテクチャ",text:"エージェントワークフローにおける「ルーティング」と「オーケストレーター-ワーカー」を組み合わせて使う設計（まず入力を分類し、その後専門オーケストレーターに委譲する）が有効な場面は？",choices:["入力の種類によって必要なサブタスク構成が大きく異なる複雑なシステム","すべての入力が同じ処理で済む単純なシステム","パターンの組み合わせはエージェント設計では禁止されている","ルーティングとオーケストレーターは同時に使用できない技術的制約がある"],correct:0,explanation:"入力の種類によって必要なサブタスク構成が大きく異なる複雑なシステムでは、ルーティングとオーケストレーター-ワーカーを組み合わせる設計が有効である。",diagram:"orchestrator_worker"},
{domain:"アジェンティック・アーキテクチャ",text:"カスタマーサポートエージェントの応答が事実に基づいているかを検証するために、回答の根拠となった情報源（ナレッジベースの該当箇所など）を引用させる設計の利点は？",choices:["回答の正確性を人間が検証しやすくなり、誤情報のリスクを低減できる","引用させると必ず応答が長くなりすぎて実用的でない","根拠の引用はコンプライアンスと無関係である","引用させると必ず処理速度が向上する"],correct:0,explanation:"回答の根拠となった情報源を引用させることで、人間が回答の正確性を検証しやすくなり、誤情報のリスクを低減できる。",diagram:"orchestrator_worker"},
{domain:"アジェンティック・アーキテクチャ",text:"マルチエージェントシステムの本番運用において、各エージェントの呼び出し回数やコストを個別に計測することの利点は？",choices:["どのエージェントがボトルネックやコスト超過の原因になっているかを特定し、最適化しやすくなる","個別計測をすると必ずシステム全体が不安定になる","コスト計測はマルチエージェント設計とは無関係である","計測は本番運用では技術的に不可能である"],correct:0,explanation:"各エージェントの呼び出し回数やコストを個別に計測することで、ボトルネックやコスト超過の原因を特定し、最適化しやすくなる。",diagram:"orchestrator_worker"},
{domain:"ツール設計・MCP統合",text:"ツール呼び出しが失敗した際、そのエラーが「一時的なもの（ネットワーク瞬断など）」か「恒久的なもの（無効な入力など）」かをレスポンスで区別することの利点は？",choices:["モデルがリトライすべきか、別の対処法を取るべきかを適切に判断できるようになる","区別してもモデルの挙動には一切影響しない","恒久的なエラーは常にリトライすべきだと判断させるための区別である","エラーの種類の区別はMCPの仕様上禁止されている"],correct:0,explanation:"一時的なエラーと恒久的なエラーを区別してレスポンスに含めることで、モデルがリトライすべきか別の対処をすべきか適切に判断できる。",diagram:"tool_call_flow"},
{domain:"ツール設計・MCP統合",text:"ツールが不可逆な操作（送金・削除など）を実行する前に、モデルに一度確認ステップ（confirmation flow）を挟ませる設計の利点は？",choices:["誤った引数やユーザーの意図しない実行による損害を未然に防げる","確認ステップを挟むと常に処理が失敗する","不可逆な操作には確認ステップを設けるべきではない","確認ステップはMCPのプリミティブとして実装できない"],correct:0,explanation:"不可逆な操作の前に確認ステップを挟むことで、誤った引数やユーザーの意図しない実行による損害を未然に防げる。",diagram:"permission_hooks"},
{domain:"ツール設計・MCP統合",text:"MCPにおける「信頼モデル（trust model）」として、クライアントが接続するMCPサーバーが提供するツールの説明文をそのまま無条件に信頼すべきではない理由は？",choices:["悪意あるサーバーが誤解を招く説明文でモデルを意図しない操作に誘導する可能性があるため","MCPサーバーの説明文は常に暗号化されているため信頼性を検証する必要がない","ツールの説明文はモデルの判断に一切影響しないため信頼性は問題にならない","MCPには信頼モデルという概念が存在しない"],correct:0,explanation:"悪意あるMCPサーバーが誤解を招く説明文でモデルを意図しない操作に誘導する可能性があるため、説明文を無条件に信頼すべきではない。",diagram:"mcp_architecture"},
{domain:"ツール設計・MCP統合",text:"MCPの設定スコープ（プロジェクト単位・ユーザー単位・ローカル単位など）を使い分けることの利点は？",choices:["チーム共有すべき設定と、個人環境固有の設定を適切に分離して管理できる","スコープを分けると常にMCPサーバーへの接続が禁止される","設定スコープはセキュリティにのみ関係し利便性とは無関係","スコープの概念はMCPには存在しない"],correct:0,explanation:"設定スコープを使い分けることで、チーム共有すべき設定と個人環境固有の設定を適切に分離して管理できる。",diagram:"mcp_architecture"},
{domain:"ツール設計・MCP統合",text:"ツールの呼び出し結果が「成功したかどうか不確実な状態（タイムアウトで応答が届かなかった場合など）」を扱う際、単純に失敗として扱うのではなく不確実な状態として明示的に伝えることの利点は？",choices:["モデルが安易に同じ操作を再実行して意図しない重複実行を招くリスクを減らせる","不確実な状態を明示すると必ず処理が高速化する","不確実な状態は常に成功として扱うべきである","この区別はMCPやツール設計とは無関係である"],correct:0,explanation:"不確実な状態を明示的に伝えることで、モデルが安易に同じ操作を再実行し意図しない重複実行を招くリスクを減らせる。",diagram:"retry_timeout"},
{domain:"ツール設計・MCP統合",text:"Tool useにおいて、モデルに特定のツールを強制的に呼び出させたい場合（tool_choiceのような制御）が有効な場面は？",choices:["次のアクションとして特定のツール呼び出しが必須であることが事前にわかっている場合","モデルの自由な判断に完全に任せたい場合には常に有効である","ツール呼び出しを強制する機能はAPIの仕様上存在しない","tool_choiceを使うとツールの説明文が不要になる"],correct:0,explanation:"次のアクションとして特定のツール呼び出しが必須であるとわかっている場合には、ツール呼び出しを強制する制御が有効である。",diagram:"tool_call_flow"},
{domain:"ツール設計・MCP統合",text:"複数のツールの説明文を作成する際、単に機能を列挙するのではなく「典型的な利用シナリオ」を含めることの利点は？",choices:["モデルがどのような状況でそのツールを選ぶべきかを具体的にイメージしやすくなる","シナリオを含めるとツールの実行速度が上がる","典型的な利用シナリオを書くことはMCPの仕様違反になる","シナリオの記載はツール選択の精度に一切影響しない"],correct:0,explanation:"典型的な利用シナリオを説明文に含めることで、モデルがどのような状況でそのツールを選ぶべきか具体的にイメージしやすくなる。",diagram:"tool_call_flow"},

{domain:"Agentic Architecture",text:"In a multi-agent configuration, what is the main benefit of separating the orchestrator (parent) agent from subagents?",choices:["Specialized tasks can be executed in parallel without polluting the context window","Subagents always use a more capable model than the parent","Subagents can never use any tools","API call counts are always reduced"],correct:0,explanation:"Because subagents operate in an independent context, they can handle specialized tasks without consuming the parent agent's conversation context.",diagram:"orchestrator_worker"},
{domain:"Agentic Architecture",text:"What is the architecture generally called in which an agent repeats a \"plan -> act -> verify\" loop?",choices:["The ReAct pattern","Single-shot inference","A static pipeline","Batch processing"],correct:0,explanation:"ReAct (Reasoning + Acting) is an agent pattern that advances a task by alternating between reasoning and acting.",diagram:"react_loop"},
{domain:"Agentic Architecture",text:"In a long-running agent task, what is the main risk of parallelizing subtasks?",choices:["Contention (race conditions) can occur over shared resources or files","Token consumption is always reduced","Latency always increases","Tool calls are prohibited"],correct:0,explanation:"In parallel execution, multiple tasks may access the same resource simultaneously, which can cause contention and requires careful design.",diagram:"parallelization"},

{domain:"Agentic Architecture",text:"Which of the following correctly describes the difference between the \"orchestrator-worker\" workflow and the \"parallelization\" workflow?",choices:["Parallelization executes predefined, fixed subtasks simultaneously, whereas the orchestrator dynamically determines subtasks at runtime","Parallelization always completes with a single model call","The orchestrator pattern cannot use tools","There is no difference between the two"],correct:0,explanation:"The parallelization pattern executes multiple predetermined tasks concurrently, whereas the orchestrator pattern has the flexibility to dynamically determine subtasks at runtime.",diagram:"orchestrator_worker"},

{domain:"Agentic Architecture",text:"In what situation is the \"prompt chaining\" workflow well suited?",choices:["When a task can be broken into clear sequential steps, and each step's output can be validated before moving to the next","Only for a single, very simple classification task","Only when parallel execution is impossible","Only when the model generates images"],correct:0,explanation:"Prompt chaining is an effective workflow when a task can be broken into ordered substeps and each stage can be validated.",diagram:"prompt_chaining"},
{domain:"Agentic Architecture",text:"Comparing an agentic workflow with a simple prompt + LLM call, in what typical situation should the agentic approach be adopted?",choices:["When the task is complex and open-ended, and the number of steps cannot be predicted in advance","When the task is simple and follows a fixed procedure","When latency is the top priority and nothing else matters","When the goal is always to minimize cost"],correct:0,explanation:"For complex tasks where the number of steps or procedure cannot be predicted in advance, an agentic approach that makes dynamic decisions as it proceeds is suitable.",diagram:"orchestrator_worker"},

{domain:"Claude Code Configuration & Workflow",text:"What is an appropriate purpose for using MEMORY.md or memory files in Claude Code?",choices:["Persistently recording the user's preferences and project background across sessions","Using it only to store temporary debug output","Storing API keys","Using it as a substitute for source code"],correct:0,explanation:"Memory files are a mechanism for persisting knowledge or preferences you want to reuse across conversation sessions.",diagram:"claude_code_config"},
{domain:"Prompt Engineering & Structured Output",text:"When you want the model to produce strict JSON output, what is the most effective way to instruct it?",choices:["Explicitly specify the expected output schema or a concrete example, and clearly instruct it not to include extraneous text","Give no instructions and leave it to the model's judgment","Say nothing about the output format","Always have it respond in natural language"],correct:0,explanation:"Explicitly specifying the output schema or a concrete example increases the accuracy with which the model returns the expected structured output.",diagram:"structured_output_schema"},
{domain:"Prompt Engineering & Structured Output",text:"Which correctly describes the difference in roles between the system prompt and the user prompt?",choices:["The system prompt sets the model's overall behavior and role, while the user prompt conveys individual requests","Both play exactly the same role","The system prompt is used only for image input","The user prompt changes the model's weights"],correct:0,explanation:"The system prompt is used to set the overall role and behavior, while the user prompt conveys the content of individual requests.",diagram:"system_vs_user_prompt"},
{domain:"Prompt Engineering & Structured Output",text:"What is the benefit of few-shot prompting?",choices:["It can improve accuracy by demonstrating the expected output format or style with concrete examples","It can always reduce the token count to zero","It is synonymous with fine-tuning the model","It always shortens latency"],correct:0,explanation:"Providing a small number of concrete examples makes it easier for the model to learn the expected output format and style.",diagram:"structured_output_schema"},
{domain:"Prompt Engineering & Structured Output",text:"What is the main benefit of structuring a prompt with XML tags (e.g., <thinking> or <answer>)?",choices:["It becomes easier for the model to clearly distinguish between the instructions and where the output should go","It stops consuming tokens","It enables the model to generate images","It is required for encrypting API responses"],correct:0,explanation:"Using XML tags allows clear separation of instructions, examples, and output areas within a prompt, which improves the model's comprehension accuracy.",diagram:"structured_output_schema"},
{domain:"Prompt Engineering & Structured Output",text:"In what situation is \"chain-of-thought\" prompting effective?",choices:["Tasks that require complex reasoning or multi-step calculation","Tasks involving only simple word translation","Tasks involving only image format conversion","It is always ineffective for every task"],correct:0,explanation:"For tasks that require complex reasoning or multi-step calculations, having the model make its intermediate reasoning explicit tends to improve accuracy.",diagram:"structured_output_schema"},
{domain:"Prompt Engineering & Structured Output",text:"Which technique is preferred over \"negative instructions\" (things to avoid) for increasing output consistency in a prompt?",choices:["Explicitly and positively instructing the desired behavior","Giving no instructions at all","Listing only prohibitions","Never showing any output examples"],correct:0,explanation:"Positive, specific instructions about what \"to do\" tend to be followed more reliably by the model than negative instructions about what \"not to do.\"",diagram:"structured_output_schema"},
{domain:"Prompt Engineering & Structured Output",text:"What is the benefit of using a tool use \"input schema\" to obtain structured output?",choices:["It makes it easier to force the model's output to conform to a predefined JSON schema","The model can then only output images","Latency is always reduced to zero","Using a tool eliminates the need for a prompt"],correct:0,explanation:"Using a tool use input schema makes it easier to align the model's output with a predefined structure, improving parsing reliability.",diagram:"structured_output_schema"},
{domain:"Prompt Engineering & Structured Output",text:"When working with long contexts, why is it recommended to place important instructions near the end of the prompt?",choices:["Because the model generally tends to pay stronger attention to more recent instructions","Because information at the beginning is automatically discarded","Because the API returns an error unless instructions are placed at the end","There is no particular reason"],correct:0,explanation:"In long contexts, instructions placed nearer the end tend to receive more of the model's attention, so it is recommended to place important instructions near the end.",diagram:"structured_output_schema"},
{domain:"Tool Design & MCP Integration",text:"What is the main purpose of MCP (Model Context Protocol)?",choices:["To connect LLM applications to external data sources and tools in a standardized way","To encrypt the model's training data","To optimize GPU memory usage","To speed up UI rendering"],correct:0,explanation:"MCP is an open protocol that lets LLM applications connect to external data sources and tools in a standardized way.",diagram:"mcp_architecture"},

{domain:"Tool Design & MCP Integration",text:"What is a best practice when writing a tool (function) description?",choices:["Describe specifically and clearly when and why the tool should be used","Make it as vague as possible to maximize the model's freedom","Omit the description and let the model judge from the name alone","Reuse a description that overlaps with other tools without adjustment"],correct:0,explanation:"Writing a tool's description with specific conditions and purposes for its use enables the model to select and use the tool appropriately.",diagram:"tool_call_flow"},
{domain:"Tool Design & MCP Integration",text:"What problem commonly arises when multiple tools have similar functionality?",choices:["The model becomes confused about which tool to choose, increasing the likelihood of incorrect calls","Latency is always reduced","Token consumption is always reduced to zero","No problem occurs at all"],correct:0,explanation:"When many tools have overlapping functionality, it becomes harder for the model to choose the appropriate tool, increasing the risk of incorrect calls.",diagram:"tool_call_flow"},
{domain:"Tool Design & MCP Integration",text:"What is the most appropriate role of \"Resources\" in MCP?",choices:["Exposing data (such as files or API responses) that the application can use as context","Executing fine-tuning of the model","Controlling network routing","Rendering UI components"],correct:0,explanation:"Resources is a primitive representing data exposed by an MCP server to a client that can be used as context.",diagram:"mcp_architecture"},
{domain:"Tool Design & MCP Integration",text:"When designing a tool's return value (response), what anti-pattern should be avoided?",choices:["Returning unnecessarily large, verbose raw data as-is, which consumes context","Returning necessary information concisely formatted","Returning a clear error message on failure","Returning results in a consistent format"],correct:0,explanation:"Returning verbose raw data as-is wastes the context window and reduces the model's processing efficiency and accuracy.",diagram:"tool_call_flow"},
{domain:"Tool Design & MCP Integration",text:"Why should idempotency be considered when designing a tool that calls an external API?",choices:["To prevent unintended side effects (such as double billing) even if retries occur","Idempotency is unrelated to latency and need not be considered","To reduce the number of output tokens","To unify the UI's appearance"],correct:0,explanation:"Even if a retry occurs due to a network error, an idempotent design prevents side effects from duplicate execution of the same operation.",diagram:"retry_timeout"},
{domain:"Context Management & Reliability",text:"What is a common way to handle a conversation approaching the context window limit as it grows longer?",choices:["Summarizing/compressing old messages to keep only the important information","Forcibly terminating the model","Unconditionally deleting all history","Doing nothing"],correct:0,explanation:"Summarizing and compressing old conversation history allows important information to be retained while working within the context window constraint.",diagram:"context_compaction"},
{domain:"Context Management & Reliability",text:"What is the main benefit of using prompt caching?",choices:["It reduces the reprocessing cost and latency of long, repeatedly used context (such as a system prompt)","The model's accuracy always improves","The context window becomes unlimited","Output tokens are automatically encrypted"],correct:0,explanation:"Prompt caching is a mechanism that skips recomputation of fixed context that is used repeatedly, reducing cost and latency.",diagram:"prompt_caching"},
{domain:"Context Management & Reliability",text:"What should be done with the results of a tool call for an agent to operate reliably?",choices:["Verify the result and, if an error is returned, handle it appropriately or retry","Proceed to the next step without checking the result at all","Always ignore errors","Encrypt the result and discard it"],correct:0,explanation:"Verifying tool call results and appropriately handling errors is essential to reliable agent design.",diagram:"tool_call_flow"},
{domain:"Context Management & Reliability",text:"Why is a design that isolates context using subagents effective?",choices:["It prevents large intermediate outputs and tool results from consuming the parent agent's limited context","Subagents always have unlimited context","Using subagents always reduces cost to zero","Isolation has no effect"],correct:0,explanation:"By delegating processing to a subagent, large volumes of intermediate output can be prevented from consuming the parent agent's context.",diagram:"subagent_isolation"},
{domain:"Context Management & Reliability",text:"What is the benefit of persisting progress or state externally (to a file or memory) in a long-running agent task?",choices:["The task can continue without losing context even if the session is interrupted and resumed","Persisting automatically expands the context window","Persisting only ever increases security risk","Persisting always degrades the model's reasoning ability"],correct:0,explanation:"Persisting progress externally allows the task to continue while preserving context even if the session is interrupted and resumed.",diagram:"context_compaction"},
{domain:"Context Management & Reliability",text:"What is the purpose of the \"LLM-as-judge\" pattern for verifying the reliability of model output?",choices:["Evaluating and scoring generated output with a separate LLM call, and prompting regeneration if quality standards are not met","Directly training the model","Measuring network latency","Testing UI accessibility"],correct:0,explanation:"In the LLM-as-judge pattern, a separate LLM call is used to evaluate the output, and if quality standards are not met, a corrective action such as regeneration is prompted.",diagram:"llm_as_judge"},
{domain:"Agentic Architecture",text:"What is the main benefit of limiting the tools given to a subagent to the minimum necessary?",choices:["It reduces the risk of incorrect tool calls and lets the subagent focus on its intended role","Fewer tools always slow down the model's reasoning speed","Limiting tools always increases cost","The number of tools has no effect on the model's performance"],correct:0,explanation:"Limiting available tools to only those needed for a role reduces the risk of the model selecting the wrong tool and helps it focus on its intended specialization.",diagram:"subagent_isolation"},
{domain:"Agentic Architecture",text:"In the \"orchestrator-workers\" pattern, when the orchestrator integrates the results from workers, what should be given particular attention?",choices:["Variation in each worker's output format complicates the integration process","Workers always return the same result, so integration is unnecessary","Integration must always be done by a human, not the model","Worker output must be encrypted before integration"],correct:0,explanation:"If each worker's output format is not standardized, the orchestrator's process of integrating results becomes more complex and error-prone.",diagram:"orchestrator_worker"},
{domain:"Agentic Architecture",text:"What problem tends to occur if a stopping condition is not explicitly designed for an agent?",choices:["Wasteful loops or near-infinite attempts occur, increasing cost and latency","The task is always completed in a single call","The model automatically compresses the context","No particular problem occurs"],correct:0,explanation:"Without a clear stopping condition, the agent cannot determine whether it has achieved its objective, risking wasteful loops that increase cost and latency.",diagram:"orchestrator_worker"},
{domain:"Agentic Architecture",text:"In an autonomous agent loop, what is the significance of incorporating feedback from the environment (such as tool results) at every step?",choices:["It allows the next action to be adaptively determined based on the latest real-world state","Incorporating feedback always reduces latency to zero","Feedback directly rewrites the model's training data","Ignoring feedback always yields higher accuracy"],correct:0,explanation:"Incorporating environmental feedback at each step allows the next action to be adaptively determined based on the latest state, making the agent more robust to changing conditions.",diagram:"react_loop"},
{domain:"Agentic Architecture",text:"Why is it common to give different system prompts to each agent in a multi-agent system?",choices:["To clearly separate roles and areas of expertise so each agent's behavior is optimized for its own task","Because a system prompt cannot be shared within a single system, so it is split out of necessity","Because using different prompts always lowers API cost","To use different model versions"],correct:0,explanation:"Giving each agent a system prompt that clearly defines its role makes it easier for each to behave in line with its specialization.",diagram:"system_vs_user_prompt"},
{domain:"Agentic Architecture",text:"What is the significance of \"human-in-the-loop\" in agent design?",choices:["Involving human judgment and approval for important decisions or irreversible operations","A mechanism to completely remove humans from the process","A mechanism to automatically approve all model responses","A design whose sole purpose is to increase latency"],correct:0,explanation:"Human-in-the-loop is a design that involves human judgment and approval at points of important or irreversible decision-making, improving safety and reliability.",diagram:"human_in_the_loop"},
{domain:"Agentic Architecture",text:"Why should a subagent's result be returned to the parent agent as a summary rather than as raw intermediate data?",choices:["To avoid unnecessarily consuming the parent agent's context window","Because summarizing always makes the information more accurate","Because the API specification prohibits sending raw data","Because summarizing has no relation to model cost"],correct:0,explanation:"Returning a subagent's detailed intermediate data as-is would consume the parent agent's context, so it is preferable to return a summary of the key points.",diagram:"subagent_isolation"},
{domain:"Agentic Architecture",text:"What is the benefit of combining deterministic code (if-statements, scripts) with LLM calls when designing an agent workflow?",choices:["Reliability and efficiency can both be achieved by leaving processing that requires certainty to code and leaving only judgment/generation tasks to the LLM","Handling everything with the LLM alone is always cheaper","Code and LLMs cannot be combined","Using code disqualifies something from being called an agent"],correct:0,explanation:"Executing deterministic processing with ordinary code and leaving only the parts that require flexible judgment or generation to the LLM allows reliability and cost efficiency to both be achieved.",diagram:"orchestrator_worker"},
{domain:"Agentic Architecture",text:"Why is a design in which an agent iteratively narrows down search results effective in \"agentic search\"?",choices:["Because when the initial query alone is insufficient, the query can be adjusted based on the information obtained, improving accuracy","Because the goal is to limit the number of searches to one","Because iterative search always reduces cost to zero","Because iterative search always eliminates latency"],correct:0,explanation:"When a single search does not yield sufficient information, iteratively adjusting the query based on the results obtained can improve final accuracy.",diagram:"react_loop"},
{domain:"Agentic Architecture",text:"What is the significance of logging an agent's decision-making process?",choices:["It helps investigate the cause of failures and audit/improve behavior","Logging automatically improves the model's reasoning accuracy","Logs must never be retained for regulatory reasons","Logs must always be passed to the model as part of the context window on every call"],correct:0,explanation:"Recording the decision-making process in logs provides material for investigating the cause of failures and for auditing/improving the agent's behavior.",diagram:"orchestrator_worker"},
{domain:"Agentic Architecture",text:"When running multiple subagents in parallel, what is the benefit of each subagent having an independent context?",choices:["Trial-and-error or errors in one subagent do not affect the others","Having an independent context always slows down processing","Having independence means tools can no longer be used","Independent contexts are prohibited by API constraints"],correct:0,explanation:"Because each subagent operates in an independent context, trial-and-error or errors in one subagent are less likely to propagate to others.",diagram:"parallelization"},
{domain:"Agentic Architecture",text:"When presenting an agent with \"a list of available tools and how to use them,\" which of the following is not good design?",choices:["Omitting descriptions for all tools and listing only their names","Clearly stating each tool's purpose, input parameters, and the situations in which it should be used","Clearly indicating how to distinguish between similar tools","Including examples of the output format"],correct:0,explanation:"Listing only tool names and omitting descriptions leaves the model unable to judge purpose or usage conditions, leading to incorrect tool selection, so this is not good design.",diagram:"tool_call_flow"},
{domain:"Agentic Architecture",text:"Why should an upper limit be placed on the number of generate-and-evaluate loop iterations in the \"evaluator-optimizer\" workflow?",choices:["To prevent unlimited looping and the resulting increase in cost and latency when the criteria cannot be met","Because without a limit, output always keeps improving","Because the limit is enforced by the API specification and need not be considered","Because setting a limit makes the evaluator unnecessary"],correct:0,explanation:"Even if the evaluation criteria cannot be met, looping indefinitely would cause unbounded increases in cost and latency, so an upper limit on the number of iterations should be set.",diagram:"evaluator_optimizer"},
{domain:"Agentic Architecture",text:"Why is it important to explicitly manage \"state\" in agent architecture?",choices:["It allows consistent tracking of progress and intermediate results for tasks spanning multiple steps","State management always only increases cost with no benefit","A stateless design is always superior","State management is relevant only to UI design"],correct:0,explanation:"Explicitly managing state allows consistent tracking of progress and intermediate results across multi-step tasks, making it easier to resume or verify midway through.",diagram:"orchestrator_worker"},
{domain:"Agentic Architecture",text:"What is an appropriate criterion for deciding whether to answer a task with a single powerful one-shot prompt versus decomposing it into a multi-step agent workflow?",choices:["Comprehensively considering the task's complexity, whether validation steps are needed, and the tolerance for cost and latency","Always choosing the agent workflow","Always choosing a single prompt","No such criterion exists"],correct:0,explanation:"The decision between a single prompt and an agent workflow should comprehensively weigh the task's complexity, the need for validation, and the acceptable cost and latency.",diagram:"orchestrator_worker"},
{domain:"Agentic Architecture",text:"What is a desirable recovery design when an agent makes an incorrect tool call?",choices:["Feed the error content back to the model so it can retry with a corrected call","Immediately terminate the entire process when an error occurs","Ignore the error and move on to an unrelated task","Never notify the user of the error"],correct:0,explanation:"When a tool call fails, feeding the error content back to the model so it can retry with a corrected call improves task continuity and reliability.",diagram:"tool_call_flow"},
{domain:"Claude Code Configuration & Workflow",text:"In Claude Code, what is the setting called that controls whether specific tools (such as Bash commands) may be executed, via allow/deny lists?",choices:["Permission settings (allow/deny rules)","Theme settings","Font settings","Plugin marketplace settings"],correct:0,explanation:"In Claude Code, whether specific tools or commands may be executed can be controlled through permission settings such as allow/deny rules.",diagram:"tool_call_flow"},
{domain:"Claude Code Configuration & Workflow",text:"What is the recommended basic policy when creating a Git commit in Claude Code?",choices:["Create a commit only when the user explicitly requests it","Automatically commit everything after every change","Always leave the commit message empty","Recommend pushing directly to the main branch"],correct:0,explanation:"To avoid unintended commits, the basic policy is to create a commit only when the user explicitly requests it.",diagram:"claude_code_config"},
{domain:"Claude Code Configuration & Workflow",text:"What is an appropriate main purpose for using Claude Code's subagent feature?",choices:["Delegating processing to an independent agent with behavior and a tool set specialized for a particular task","Forcibly deleting the main conversation history","Consolidating every task into one giant prompt","Changing network settings"],correct:0,explanation:"The subagent feature is used to delegate processing to an independent agent with behavior and a tool set specialized for a particular task.",diagram:"subagent_isolation"},
{domain:"Claude Code Configuration & Workflow",text:"What best practice should be followed before executing a destructive command (such as rm -rf) in Claude Code?",choices:["Check the current state with something like git status, and leave a way to revert if possible","Execute immediately without checking anything","Execute without taking a backup","Execute without informing the user"],correct:0,explanation:"Before performing a destructive operation, it is advisable to check the current state and, where possible, leave a means of reverting it.",diagram:"permission_hooks"},
{domain:"Claude Code Configuration & Workflow",text:"What is an appropriate purpose for the \"Skill\" feature in Claude Code?",choices:["Packaging the procedures and best practices for a specific task so they can be reused repeatedly","A feature used only for managing model API keys","A feature for configuring the OS firewall","A feature that replaces the OS package manager"],correct:0,explanation:"The Skill feature is a mechanism for packaging the procedures and best practices for a specific task so they can be reused whenever needed.",diagram:"claude_code_config"},
{domain:"Claude Code Configuration & Workflow",text:"If you want different permission settings for each project in Claude Code, where is it common to manage them?",choices:["In a project configuration file such as .claude/settings.json","Only in OS-wide global environment variables","In browser cookies","In a DNS configuration file"],correct:0,explanation:"Project-specific permission settings are commonly managed in a per-project configuration file such as .claude/settings.json.",diagram:"claude_code_config"},
{domain:"Claude Code Configuration & Workflow",text:"What is the benefit of running a long-running task in the background in Claude Code?",choices:["The user can proceed with other work in parallel and receive a notification when it completes","Background execution never returns any results at all","Background execution is always less accurate than foreground execution","Background execution is prohibited for security reasons"],correct:0,explanation:"Using background execution lets the user proceed with other work in parallel and receive a notification when the task completes.",diagram:"claude_code_config"},
{domain:"Claude Code Configuration & Workflow",text:"Why is it important to give clear instructions when requesting a code review in Claude Code?",choices:["Narrowing the review focus (bugs, security, performance, etc.) makes it easier to get precise feedback","The review always produces the same result regardless of instructions, so they are unnecessary","Giving instructions makes the review impossible to perform","Instructions have no effect at all on the review"],correct:0,explanation:"Clearly specifying the review focus makes it easier to obtain precise, purpose-aligned feedback.",diagram:"claude_code_config"},
{domain:"Claude Code Configuration & Workflow",text:"What is the purpose of using Claude Code hooks to block certain conditions before a tool executes?",choices:["To automatically prevent unintended, dangerous operations before they are executed","To always allow every tool call","Hooks are used only for displaying tool execution results","Using hooks prevents Claude Code from starting up"],correct:0,explanation:"Blocking specific conditions with a pre-tool-execution hook automatically prevents unintended, dangerous operations before they occur.",diagram:"permission_hooks"},
{domain:"Claude Code Configuration & Workflow",text:"What is the design benefit of restricting the tools assigned to a custom subagent in Claude Code?",choices:["It reduces the risk of the subagent performing operations that deviate from its intended role","Restricting tools always increases processing speed","Restricting tools makes it impossible to define a subagent","Restriction has no benefit"],correct:0,explanation:"Restricting the tools assigned to a subagent reduces the risk of it performing operations that deviate from its intended role.",diagram:"subagent_isolation"},
{domain:"Claude Code Configuration & Workflow",text:"Why is it recommended to use \"plan mode\" to obtain user approval before making a large-scale change in Claude Code?",choices:["It can prevent misunderstandings about the implementation approach and unintended large-scale changes","Using plan mode automatically reverts changes","Plan mode is a feature for changing code without approval","Plan mode is a feature solely for generating documentation"],correct:0,explanation:"Obtaining user approval in advance via plan mode can prevent misunderstandings about the implementation approach and unintended large-scale changes.",diagram:"permission_hooks"},
{domain:"Claude Code Configuration & Workflow",text:"Why is it important to have Claude Code follow the existing test framework and conventions when writing test code?",choices:["It maintains consistency across the whole project and alignment with CI and team members","Test frameworks need not be followed on a per-project basis","Following conventions makes it impossible to run the tests","Consistency does not matter"],correct:0,explanation:"Following the existing test framework and conventions maintains consistency across the whole project and alignment with CI and team members.",diagram:"claude_code_config"},
{domain:"Prompt Engineering & Structured Output",text:"Why is it recommended to place a long document or data at the beginning of a prompt, followed by the specific instructions?",choices:["So the model can grasp the entire context first and then respond accurately to the instructions","Order has no effect at all on the model's response","Writing instructions first always causes an error","Documents can only be placed after instructions, by specification"],correct:0,explanation:"Presenting a long document or data first, followed by specific instructions, makes it easier for the model to grasp the entire context before responding accurately.",diagram:"structured_output_schema"},
{domain:"Prompt Engineering & Structured Output",text:"What is the effect of explicitly giving the model a role (persona) when having it perform a complex task?",choices:["It becomes easier to elicit responses aligned with the desired perspective or expertise","Giving a role always reduces the number of output tokens","Setting a role is effective only for image input","Giving a role always leads to an incorrect response"],correct:0,explanation:"Explicitly giving a role (persona) makes it easier to elicit responses aligned with the desired perspective and expertise.",diagram:"system_vs_user_prompt"},
{domain:"Prompt Engineering & Structured Output",text:"What technique is effective for increasing the reproducibility (consistency of response for the same input) of output?",choices:["Setting temperature low and strictly specifying the output format","Setting temperature to the maximum value","Not specifying the output format at all","Randomly changing the prompt every time"],correct:0,explanation:"Setting temperature low and strictly specifying the output format makes it easier to increase the reproducibility of the response for the same input.",diagram:"structured_output_schema"},
{domain:"Prompt Engineering & Structured Output",text:"What is an effective way to instruct the model when you want it to generate multiple candidate proposals?",choices:["Explicitly specify the number of candidates to generate and the evaluation criteria for each","Request it without specifying the number of candidates, leaving it vague","Candidate generation cannot be controlled via the system prompt","Candidate generation always requires multiple separate API calls"],correct:0,explanation:"Explicitly specifying the number of candidates desired and the evaluation criteria makes it easier to obtain multiple proposals that match expectations.",diagram:"structured_output_schema"},
{domain:"Prompt Engineering & Structured Output",text:"As a countermeasure against prompt injection, what design is recommended when handling text obtained from external sources?",choices:["Clearly distinguish externally sourced text as data and instruct the model not to interpret it as instructions","Treat external text the same as the system prompt and always trust it","Take no countermeasures at all regarding external text","Always ignore external text and never read it"],correct:0,explanation:"Clearly distinguishing externally sourced text as data and instructing the model not to interpret it as instructions can reduce the risk of prompt injection.",diagram:"structured_output_schema"},
{domain:"Prompt Engineering & Structured Output",text:"When requesting long output, what is an appropriate technique to reduce the risk of the output being cut off midway?",choices:["Have the output generated in stages, or set the maximum token count appropriately","Always have everything generated in a single request, with no countermeasures needed","Output being cut off is solely a model-side problem with no remedy","Splitting the output always reduces accuracy"],correct:0,explanation:"Generating output in stages, or setting the maximum token count appropriately, can reduce the risk of long output being cut off partway through.",diagram:"structured_output_schema"},
{domain:"Prompt Engineering & Structured Output",text:"What is the benefit of having the model perform self-critique on its output?",choices:["Having it review its own generated answer can reduce errors and inconsistencies","Self-critique always reduces cost to zero","Self-critique is effective only for image generation","Self-critique always shortens the output"],correct:0,explanation:"The technique of self-critique, where the model reviews its own generated answer, can potentially reduce errors and inconsistencies.",diagram:"structured_output_schema"},
{domain:"Prompt Engineering & Structured Output",text:"Why should ambiguous instructions (e.g., \"make it feel right\") be avoided in a prompt?",choices:["Because the model cannot accurately infer the intent, making output that differs from expectations more likely","Because ambiguous instructions always produce higher-accuracy output","Because ambiguous instructions always cause an API error","Because ambiguity has no effect at all on the output token count"],correct:0,explanation:"With ambiguous instructions, the model cannot accurately infer the intent, making output that differs from expectations more likely, so specific instructions are recommended.",diagram:"structured_output_schema"},
{domain:"Prompt Engineering & Structured Output",text:"What is the benefit of clearly distinguishing required fields from optional fields when defining a structured output schema?",choices:["The model can correctly understand which information it must fill in, reducing omissions or erroneous generation","Making this distinction has no effect on the model's behavior","Defining optional fields always causes an error","Schemas can only be used with the JSON format"],correct:0,explanation:"Clearly distinguishing required from optional fields lets the model correctly understand what information it must fill in, reducing omissions and erroneous generation.",diagram:"structured_output_schema"},
{domain:"Prompt Engineering & Structured Output",text:"Assuming the model's output will be parsed by a downstream program, which instruction should be avoided in the prompt?",choices:["An instruction allowing extra text, such as \"feel free to add supplementary explanation as needed\"","An instruction specifying the output must be JSON only, with no other text","An instruction specifying key names and types explicitly","An instruction providing a sample output"],correct:0,explanation:"Assuming the output will be parsed by a program, an instruction that allows extra free text should be avoided, since it can cause parsing errors.",diagram:"structured_output_schema"},
{domain:"Prompt Engineering & Structured Output",text:"What characteristic of a task makes it beneficial to include step-by-step instructions in a prompt?",choices:["A complex task that reaches a final conclusion through multiple intermediate judgments","An extremely simple task that only returns a single fixed value","A task that simply returns raw binary image data","Step-by-step instructions are always counterproductive"],correct:0,explanation:"For complex tasks that reach a conclusion through multiple intermediate judgments, step-by-step instructions are effective for improving accuracy.",diagram:"structured_output_schema"},
{domain:"Prompt Engineering & Structured Output",text:"What is the benefit of version-controlling a prompt (recording its change history)?",choices:["Changes in output quality caused by prompt changes can be tracked, making it easier to identify the cause when a problem occurs","Version control automatically improves the output","A prompt need never be changed once created, so this is unnecessary","Version control directly reduces API cost"],correct:0,explanation:"Recording a prompt's change history lets you track changes in output quality and makes it easier to identify the cause when a problem occurs.",diagram:"structured_output_schema"},
{domain:"Tool Design & MCP Integration",text:"Which correctly describes the relationship between an MCP client and an MCP server?",choices:["The client (the LLM application side) connects to the server and uses the tools and resources it provides","The server must always be embedded inside the client","The client and server can only run in the same process","MCP makes no distinction between client and server"],correct:0,explanation:"In MCP, the LLM application side acts as the client, connecting to the server and using the tools and resources the server provides.",diagram:"mcp_architecture"},
{domain:"Tool Design & MCP Integration",text:"What is an appropriate role for the \"Prompts\" primitive in MCP?",choices:["Providing reusable prompt templates, defined on the server side, to the client","Directly controlling the client's UI layout","Updating the model's training parameters","Generating network encryption keys"],correct:0,explanation:"Prompts is a primitive for providing reusable prompt templates defined by the MCP server to the client.",diagram:"mcp_architecture"},
{domain:"Tool Design & MCP Integration",text:"In what situation should an enum be used for a tool parameter rather than a free-form string?",choices:["When the set of possible values is limited in advance","When the value is an infinitely diverse natural-language string","Enums should always be avoided for every parameter","Enums cannot be used in a tool definition"],correct:0,explanation:"When the set of possible values is limited in advance, using an enum rather than free-form text helps prevent invalid input.",diagram:"structured_output_schema"},
{domain:"Tool Design & MCP Integration",text:"Why is it important to design a response that conveys the cause of a failure and how to address it to the model when a tool fails?",choices:["So the model can understand the situation and choose an appropriate retry or alternative approach","Conveying the error content always only increases cost with no benefit","Errors should only ever be conveyed to the user, never to the model","Error messages are unrelated to tool design"],correct:0,explanation:"Conveying the cause of a failure and how to address it to the model allows the model to understand the situation and choose an appropriate retry or alternative approach.",diagram:"tool_call_flow"},
{domain:"Tool Design & MCP Integration",text:"What should be considered when connecting multiple MCP servers simultaneously?",choices:["Designing so the tool names or functionality provided by each server do not overlap or conflict","Only one MCP server can be connected at a time","Connecting multiple servers always improves security","Connecting multiple servers simultaneously is technically impossible"],correct:0,explanation:"When connecting multiple MCP servers simultaneously, care must be taken to ensure the tool names or functionality each provides do not overlap or conflict.",diagram:"mcp_architecture"},
{domain:"Tool Design & MCP Integration",text:"What should be considered when designing a tool for a long-running operation (such as a long job)?",choices:["Providing a means of asynchronous execution or progress checking so the caller does not mistake a timeout for a failure","Always making it wait synchronously until completion, with no other consideration needed","Long-running operations cannot be designed as tools","Time-consuming operations should always result in an error"],correct:0,explanation:"For time-consuming operations, providing a means of asynchronous execution or progress checking prevents the caller from mistaking a timeout for a failure.",diagram:"tool_call_flow"},
{domain:"Tool Design & MCP Integration",text:"What is the purpose of properly designing authentication and authorization for an MCP server?",choices:["To prevent unauthorized clients from accessing sensitive data or dangerous operations","Adding authentication always increases the tool's response speed","MCP is a protocol with no concept of authentication, so it is unnecessary","Authentication, once set, can never be changed again"],correct:0,explanation:"Properly designing authentication and authorization prevents unauthorized clients from accessing sensitive data or dangerous operations.",diagram:"mcp_architecture"},
{domain:"Tool Design & MCP Integration",text:"Why should backward compatibility be considered when changing a tool's version or interface?",choices:["To prevent existing prompts or agent configurations from suddenly breaking","Backward compatibility always only increases cost, so it is unnecessary","MCP has no concept of version management","Considering backward compatibility makes it impossible to add new features"],correct:0,explanation:"Changing an interface without considering backward compatibility risks suddenly breaking existing prompts or agent configurations.",diagram:"tool_call_flow"},
{domain:"Tool Design & MCP Integration",text:"What is the problem when a tool set is designed with too coarse a granularity (a single tool doing too many things)?",choices:["It becomes harder for the model to grasp the correct usage and required parameters of the tool","Coarser granularity always makes a tool easier to use","Granularity has no effect at all on the model's behavior","A tool with coarse granularity cannot be defined in MCP"],correct:0,explanation:"Packing too much functionality into a single tool makes it harder for the model to grasp the correct usage and required parameters.",diagram:"tool_call_flow"},
{domain:"Tool Design & MCP Integration",text:"In what situation is it effective to implement pagination (retrieving results in chunks) for a tool's output?",choices:["When a large volume of results could be returned at once, risking consumption of the context","When there is always exactly one result","Pagination is prohibited by the MCP specification","Implementing pagination always increases errors"],correct:0,explanation:"When a large volume of results could be returned at once, implementing pagination can prevent the context from being consumed.",diagram:"tool_call_flow"},
{domain:"Tool Design & MCP Integration",text:"What is the benefit of adding validation (type and required-field checks) to the input schema of a tool provided by an MCP server?",choices:["It allows malformed calls to be detected early, preventing unintended behavior or errors","Adding validation makes the tool impossible to call","Validation is unrelated to security","Adding validation always severely degrades latency to the point of being impractical"],correct:0,explanation:"Adding validation to the input schema allows malformed calls to be detected early, preventing unintended behavior or errors.",diagram:"mcp_architecture"},
{domain:"Context Management & Reliability",text:"When performing \"context compaction,\" why is it recommended to summarize rather than simply discard old messages?",choices:["Because it reduces token consumption without losing the important information needed to continue the task","Because summarizing always results in a complete loss of information, so it is not recommended","Because discarding is always more accurate","Because compaction is technically impossible"],correct:0,explanation:"Summarizing old messages rather than simply discarding them reduces token consumption while preserving the important information needed to continue the task.",diagram:"context_compaction"},
{domain:"Context Management & Reliability",text:"What is an effective countermeasure when an agent keeps repeating the same mistake?",choices:["Explicitly recording past failure patterns or lessons learned in context or memory, and referring to them going forward","Not recording failures, since doing so would only slow processing","Repeated mistakes cannot be addressed","Recording failures is prohibited for security reasons"],correct:0,explanation:"Explicitly recording past failure patterns or lessons learned in memory and referring to them in future decisions can reduce the recurrence of the same mistakes.",diagram:"context_compaction"},
{domain:"Context Management & Reliability",text:"Under the constraint of the context window, why is it important to design so that low-relevance information is excluded (context curation)?",choices:["Because a large amount of irrelevant information can distract the model's attention, increasing the risk of overlooking important information","Because more information always yields higher accuracy","Because curating context always causes an API error","Because curating context is impossible"],correct:0,explanation:"A large amount of irrelevant information can distract the model's attention and increase the risk of overlooking important information, which is why context curation is important.",diagram:"context_compaction"},
{domain:"Context Management & Reliability",text:"When building a highly reliable agent system, what design is appropriate for reducing a single point of failure?",choices:["Building fallback and retry mechanisms into critical processing","Consolidating all processing into a single step","Always halting the entire process unconditionally when a failure occurs","There is no need to consider eliminating a single point of failure"],correct:0,explanation:"Building fallback and retry mechanisms into critical processing reduces reliance on a single point of failure and improves overall system reliability.",diagram:"context_compaction"},
{domain:"Context Management & Reliability",text:"What is the significance of setting a timeout when returning tool call results to the model?",choices:["It prevents indefinite waiting on an unresponsive tool, preserving the responsiveness of the overall system","Setting a timeout always causes processing to fail","Timeouts are unrelated to context management","Setting a timeout makes the tool unusable"],correct:0,explanation:"Setting a timeout prevents indefinite waiting on an unresponsive tool, preserving the responsiveness of the overall system.",diagram:"retry_timeout"},
{domain:"Context Management & Reliability",text:"How can you prevent an agent from continuing to operate on old assumptions when the user's intent changes over a multi-turn conversation?",choices:["Periodically summarize and confirm the current task and assumptions, and verify they align with the user's latest intent","It is preferable never to change an assumption once made, until the very end","Changes in intent need not be considered","Continuing to use old assumptions improves reliability"],correct:0,explanation:"Periodically summarizing and confirming the current task and assumptions allows the agent to keep pace with changes in the user's intent and avoid continuing to operate on outdated assumptions.",diagram:"context_compaction"},
{domain:"Context Management & Reliability",text:"Even with a model that has a large context window, why should it not be overloaded with unnecessary information?",choices:["Because in addition to increased token cost, low-relevance information can degrade response quality","Because the larger the context window, the more information should be packed in","Because the size of the context window is unrelated to the amount of information","Because packing in information never changes the cost at all"],correct:0,explanation:"Even with a large context window, overloading it with unnecessary information not only increases token cost but can also degrade response quality due to low-relevance information.",diagram:"context_compaction"},
{domain:"Context Management & Reliability",text:"What is the benefit of preparing test cases (an evaluation dataset) before production use, to assess an agent's reliability?",choices:["It allows behavior across various input patterns to be verified in advance, catching problems early","Preparing test cases increases problems in production","An evaluation dataset never needs to be updated once created","Testing does not contribute to reliability"],correct:0,explanation:"Preparing an evaluation dataset before production use and verifying behavior across various input patterns allows problems to be caught early, improving reliability.",diagram:"llm_as_judge"},
{domain:"Context Management & Reliability",text:"What is the benefit of designing context management so that the system prompt and dynamic user context are separated?",choices:["Stable behavioral rules and volatile, situation-dependent information can be clearly distinguished and managed separately","Separating them always doubles the API cost","Separating them makes prompt caching unusable","Separation is unrelated to reliability"],correct:0,explanation:"Separating the system prompt, which defines stable behavior, from the dynamic user context, which changes frequently, makes it easier to manage each distinctly.",diagram:"system_vs_user_prompt"},
{domain:"Agentic Architecture",text:"In a multi-agent system, what is the benefit of standardizing the schema used when passing messages between agents?",choices:["Each agent can more easily interpret the other's output, reducing coordination errors","Standardizing the schema always reduces latency to zero","Schema standardization has no effect at all on model performance","Standardizing the schema makes it impossible to increase the number of agents"],correct:0,explanation:"Standardizing the schema of messages passed between agents makes it easier for each agent to interpret the other's output, reducing coordination errors.",diagram:"structured_output_schema"},
{domain:"Agentic Architecture",text:"In what situation is a design that \"shares progress with the user incrementally\" effective in an agent workflow?",choices:["For a task that takes a long time to complete, where visibility into progress is desired","Only for simple tasks that always complete instantly","Sharing progress is always prohibited for security reasons and should be avoided","Sharing progress causes the task to fail"],correct:0,explanation:"For tasks that take a long time to complete, sharing progress incrementally lets the user follow along, improving the experience.",diagram:"prompt_chaining"},
{domain:"Agentic Architecture",text:"What should be considered in the design when multiple agents may modify the same external resource (such as a file) simultaneously?",choices:["Introducing a locking or mutual-exclusion mechanism to prevent inconsistencies from contention","No mutual exclusion is needed, and simultaneous writes are always fine","By specification, multiple agents can never access the same resource","Contention is a problem that can safely be ignored"],correct:0,explanation:"When multiple agents may modify the same resource simultaneously, introducing locking or mutual exclusion can prevent inconsistencies caused by contention.",diagram:"orchestrator_worker"},
{domain:"Agentic Architecture",text:"Why is it important to design agent decision-making with explainability (why a given action was chosen)?",choices:["So humans can understand the cause of an incorrect decision and use it to drive improvement and build trust","Explainability always only increases cost with no benefit","Explainability always increases the agent's speed","Explainability is relevant only to UI design"],correct:0,explanation:"Giving agent decision-making explainability makes it easier for humans to understand the cause of an incorrect decision, aiding improvement and building trust.",diagram:"orchestrator_worker"},
{domain:"Agentic Architecture",text:"Why is a design that dynamically narrows the number of tools given to an agent according to task complexity (tool filtering) effective?",choices:["Because too many choices make the model more likely to select the wrong tool, so narrowing the choices based on the situation improves accuracy","Narrowing the number of tools always reduces API cost to zero","Tool filtering is technically impossible","The number of tools has no effect at all on the model's decisions"],correct:0,explanation:"Too many available tool choices increases the likelihood of incorrect selection, so dynamically narrowing tools based on the situation can improve accuracy.",diagram:"tool_call_flow"},
{domain:"Agentic Architecture",text:"What is the benefit of a design (plan-and-select) in which an agent formulates multiple candidate plans and then selects the best one?",choices:["Rather than being locked into a single plan, comparing multiple candidates increases the likelihood of a better decision","Formulating multiple plans always speeds up processing","Formulating multiple plans directly reduces cost","Formulating multiple plans always lowers accuracy"],correct:0,explanation:"Comparing multiple candidate plans, rather than being locked into a single plan, increases the likelihood of making a better decision.",diagram:"orchestrator_worker"},
{domain:"Agentic Architecture",text:"What is the benefit of separating \"memory (long-term)\" from \"context (short-term working area)\" in agent architecture?",choices:["It allows appropriate distinction between knowledge that should persist across sessions and information limited to the current task","Separating them always doubles the cost","Memory and context should always be treated as identical","Separation has no effect at all on reliability"],correct:0,explanation:"Separating long-term memory from short-term context allows appropriate distinction between knowledge that should persist across sessions and information limited to the current task.",diagram:"orchestrator_worker"},
{domain:"Agentic Architecture",text:"What is the significance of setting a dedicated evaluation metric (success criterion) for a subagent?",choices:["It allows the subagent's output to be objectively measured, making it easier to identify areas for improving the overall workflow","Setting an evaluation metric makes the subagent stop working","Evaluation metrics are related only to cost and unrelated to quality","There is no need at all to set an evaluation metric"],correct:0,explanation:"Setting a dedicated evaluation metric for each subagent allows its output to be objectively measured, making it easier to identify improvements for the overall workflow.",diagram:"subagent_isolation"},
{domain:"Agentic Architecture",text:"What is the benefit of a design in which an agent explicitly outputs \"what it is doing now and what it plans to do next\" (a scratchpad/visualized internal state)?",choices:["It becomes easier to debug and monitor, catching unintended behavior early","Outputting this always reduces cost to zero","Visualizing internal state only creates security risk","Visualization is of no help at all for debugging"],correct:0,explanation:"Having the agent explicitly output its internal state makes it easier to debug and monitor, catching unintended behavior early.",diagram:"orchestrator_worker"},
