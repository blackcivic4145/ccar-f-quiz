<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>CCAR-F 模擬問題集</title>
<style>
  body { font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; color: #222; background: #fafafa; }
  h1 { font-size: 1.3em; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 24px; margin-top: 16px; }
  .domain { color: #666; font-style: italic; margin-bottom: 4px; }
  .progress { color: #444; margin-bottom: 4px; }
  .qtext { font-weight: bold; font-size: 1.05em; margin: 12px 0 16px; white-space: pre-wrap; }
  label.choice { display: block; padding: 8px 10px; margin: 6px 0; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; }
  label.choice:hover { background: #f0f4ff; }
  label.choice.correct { background: #e6f4ea; border-color: #34a853; }
  label.choice.wrong { background: #fce8e6; border-color: #ea4335; }
  input[type=radio] { margin-right: 8px; }
  button { padding: 8px 18px; margin-top: 12px; margin-right: 8px; border-radius: 6px; border: 1px solid #888; background: #f5f5f5; cursor: pointer; font-size: 0.95em; }
  button:disabled { opacity: 0.5; cursor: default; }
  button.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  .feedback { margin-top: 14px; padding: 10px 12px; border-radius: 6px; white-space: pre-wrap; }
  .feedback.correct { background: #e6f4ea; }
  .feedback.wrong { background: #fce8e6; }
  .row { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
  .stats { line-height: 1.7; }
  .missed { margin-top: 16px; }
  .missed .item { padding: 8px 0; border-top: 1px solid #eee; }
  .hidden { display: none; }
  #resultSummary { font-size: 1.2em; font-weight: bold; }
</style>
</head>
<body>

<h1>CCAR-F (Claude Certified Architect - Foundations) 模擬問題集</h1>

<div id="startCard" class="card">
  <p>全 <span id="totalCount"></span> 問収録。出題数を選んで開始してください（各ドメインの出題比率を維持したままランダム抽出されます）。</p>
  <p style="color:#666; font-size:0.9em;">出題範囲: Agentic Architecture 27% / Claude Code 設定・ワークフロー 20% / プロンプトエンジニアリング・構造化出力 20% / ツール設計・MCP統合 18% / コンテキスト管理・信頼性 15%</p>
  <p style="color:#666; font-size:0.9em;">制限時間: 120分（超過すると自動採点され、ウィンドウが前面に表示されます）</p>
  <div class="row">
    <label for="countInput">出題数:</label>
    <input type="number" id="countInput" min="1" value="60">
  </div>
  <button class="primary" id="startBtn">開始する</button>
</div>

<div id="questionCard" class="card hidden">
  <div class="progress" id="progress"></div>
  <div class="domain" id="domainLabel"></div>
  <div class="progress" id="timerLabel" style="font-weight:bold;"></div>
  <div id="diagramBox" style="margin:10px 0; border:1px solid #ddd; border-radius:6px; background:#fff; overflow-x:auto;"></div>
  <div class="qtext" id="qtext"></div>
  <div id="choices"></div>
  <div class="feedback hidden" id="feedback"></div>
  <button class="primary" id="answerBtn">回答する</button>
  <button id="nextBtn" disabled>次へ</button>
</div>

<div id="resultCard" class="card hidden">
  <div id="resultSummary"></div>
  <div class="stats" id="domainStats"></div>
  <div class="missed" id="missedList"></div>
  <button class="primary" id="retryBtn">もう一度挑戦する</button>
</div>

<script>
const QUESTIONS = [
{domain:"アジェンティック・アーキテクチャ",text:"マルチエージェント構成において、オーケストレーター（親）エージェントとサブエージェントを分離する主な利点は何か？",choices:["コンテキストウィンドウを汚染せずに専門タスクを並列実行できる","サブエージェントは常に親より高性能なモデルを使う","サブエージェントはツールを一切使えなくなる","API呼び出し回数を必ず削減できる"],correct:0,explanation:"サブエージェントは独立したコンテキストで動作するため、親エージェントの会話コンテキストを圧迫せずに専門化されたタスクを処理できる。",diagram:"orchestrator_worker"},
{domain:"アジェンティック・アーキテクチャ",text:"エージェントが「計画→実行→検証」のループを繰り返すアーキテクチャは一般に何と呼ばれるか？",choices:["ReActパターン","シングルショット推論","静的パイプライン","バッチ処理"],correct:0,explanation:"ReAct（Reasoning + Acting）は推論と行動を交互に繰り返しながらタスクを進めるエージェントパターン。",diagram:"react_loop"},
{domain:"アジェンティック・アーキテクチャ",text:"長時間稼働するエージェントタスクにおいて、サブタスクを並列化することの主なリスクは何か？",choices:["共有リソースやファイルへの競合（レースコンディション）が発生しうる","トークン消費が必ず減る","レイテンシが必ず増加する","ツール呼び出しが禁止される"],correct:0,explanation:"並列実行では複数のタスクが同じリソースに同時アクセスすることで競合が発生する可能性があり、設計上の考慮が必要になる。",diagram:"parallelization"},
{domain:"アジェンティック・アーキテクチャ",text:"エージェントに「ツールを使うべきかどうか」を判断させる設計上、最も重要な要素はどれか？",choices:["各ツールの説明（description）が目的と使用条件を明確に記述していること","ツール名をすべて英語にすること","ツールの数をできるだけ増やすこと","ツールのレスポンスを常にXML形式にすること"],correct:0,explanation:"モデルはツールの説明文をもとに使用可否を判断するため、説明が曖昧だと誤ったツール選択につながる。",diagram:"tool_call_flow"},
{domain:"アジェンティック・アーキテクチャ",text:"オーケストレーター・ワーカーパターンにおいて、オーケストレーターの主な責務は何か？",choices:["タスクをサブタスクに分解し、ワーカーに割り当て、結果を統合する","すべてのAPIキーを管理する","UIの描画を行う","モデルの重みを更新する"],correct:0,explanation:"オーケストレーターはタスク分解と結果統合という調整役を担う中心的なコンポーネントである。",diagram:"orchestrator_worker"},
{domain:"アジェンティック・アーキテクチャ",text:"評価者（evaluator）エージェントを組み込む目的として最も適切なのはどれか？",choices:["生成された出力の品質をチェックし、必要に応じて再実行を促す","ユーザー入力を暗号化する","トークン数を自動的にゼロにする","モデルのファインチューニングを行う"],correct:0,explanation:"Evaluator-optimizerパターンでは、評価者が出力を検証し基準を満たすまで生成と評価を繰り返す。",diagram:"evaluator_optimizer"},
{domain:"アジェンティック・アーキテクチャ",text:"エージェントの自律性を高める際、安全性を担保するために一般的に導入されるべき仕組みはどれか？",choices:["破壊的操作の前に人間の承認を要求するチェックポイント","すべてのツールを無条件で自動実行する","ログを一切残さない","コンテキストウィンドウを無制限にする"],correct:0,explanation:"不可逆的・破壊的な操作の前に人間の確認を挟むことで、自律エージェントの暴走リスクを低減できる。",diagram:"human_in_the_loop"},
{domain:"アジェンティック・アーキテクチャ",text:"「オーケストレーター-ワーカー」型と「並列化（parallelization）」型のワークフローの違いとして正しいものはどれか？",choices:["並列化は事前に固定されたサブタスクを同時実行するが、オーケストレーターは実行時に動的にサブタスクを決定する","並列化は必ず1つのモデル呼び出しで完結する","オーケストレーター型はツールを使用できない","両者に違いはない"],correct:0,explanation:"並列化パターンは事前に決められた複数タスクを並行実行するのに対し、オーケストレーター型は実行時に動的にサブタスクを決定する柔軟性を持つ。",diagram:"orchestrator_worker"},
{domain:"アジェンティック・アーキテクチャ",text:"エージェントのワークフローにおける「ルーティング（routing）」パターンの目的は何か？",choices:["入力内容を分類し、最適な専用プロンプトやモデルに振り分ける","すべての入力を同一のプロンプトで処理する","トークン使用量を無視する","常に人間にエスカレーションする"],correct:0,explanation:"ルーティングは入力を分類し、それぞれに最適化された処理経路へ振り分けることで精度と効率を高める。",diagram:"routing"},
{domain:"アジェンティック・アーキテクチャ",text:"「Prompt chaining（プロンプトチェイニング）」ワークフローが適しているのはどのような場合か？",choices:["タスクを明確な逐次ステップに分解でき、各ステップの出力を検証してから次に進める場合","単一の非常に単純な分類タスクの場合のみ","並列実行が不可能な場合","モデルが画像を生成する場合のみ"],correct:0,explanation:"プロンプトチェイニングは、タスクを順序立てたサブステップに分解し各段階を検証できる場合に有効なワークフローである。",diagram:"prompt_chaining"},
{domain:"アジェンティック・アーキテクチャ",text:"エージェント的ワークフローとシンプルなプロンプト+LLM呼び出しを比較したとき、エージェント的アプローチを採用すべき典型的な状況は？",choices:["タスクが複雑でオープンエンドであり、事前にステップ数を予測できない場合","タスクが単純で決まった手順しかない場合","レイテンシが最優先で他は考慮しない場合","常にコストを最小化したい場合"],correct:0,explanation:"事前にステップ数や手順が予測できない複雑なタスクでは、動的に判断しながら進めるエージェント的アプローチが適している。",diagram:"orchestrator_worker"},
{domain:"Claude Code設定・ワークフロー",text:"Claude Codeにおいて、リポジトリ固有の指示やコーディング規約をClaudeに与えるための標準ファイルはどれか？",choices:["CLAUDE.md","package.json",".gitignore","README.txt"],correct:0,explanation:"CLAUDE.mdはプロジェクト固有のコンテキストや指示をClaude Codeに伝えるための標準的なファイルである。",diagram:"claude_code_config"},
{domain:"Claude Code設定・ワークフロー",text:"Claude Codeの「hooks」機能の主な用途はどれか？",choices:["特定のイベント（ツール実行前後など）に応じて自動的にシェルコマンドを実行する","モデルの重みを直接編集する","UIのテーマを変更する","ネットワーク帯域を制限する"],correct:0,explanation:"hooksはツール実行前後などの特定イベントに応じて任意のシェルコマンドを自動実行する仕組みである。",diagram:"permission_hooks"},
{domain:"Claude Code設定・ワークフロー",text:"Claude Codeでカスタムのスラッシュコマンドを追加したい場合、どこにMarkdownファイルを配置するのが一般的か？",choices:[".claude/commands/ ディレクトリ","node_modules/ ディレクトリ","システムのルートディレクトリ",".git/hooks/ ディレクトリ"],correct:0,explanation:".claude/commands/ 配下にMarkdownファイルを置くことで、独自のスラッシュコマンドを定義できる。",diagram:"claude_code_config"},
{domain:"Claude Code設定・ワークフロー",text:"Claude CodeでMCPサーバーをプロジェクトに接続する設定は主にどこで管理されるか？",choices:[".mcp.json またはClaude Codeの設定ファイル","Dockerfile","tsconfig.json",".eslintrc"],correct:0,explanation:"MCPサーバーの接続情報は.mcp.jsonなどの専用設定ファイルで管理される。",diagram:"mcp_architecture"},
{domain:"Claude Code設定・ワークフロー",text:"Claude Codeの権限モード（permission mode）を制限する目的として最も適切なのはどれか？",choices:["危険なコマンドやファイル操作が実行される前にユーザーの承認を求める","モデルの応答速度を上げる","トークン価格を下げる","コンテキストウィンドウを拡張する"],correct:0,explanation:"権限モードは、破壊的・不可逆的な操作が行われる前にユーザーの確認を挟むための安全機構である。",diagram:"permission_hooks"},
{domain:"Claude Code設定・ワークフロー",text:"サブエージェント（subagent）をClaude Codeで定義する際、一般的にどのような情報をfrontmatterに記述するか？",choices:["名前、説明、使用可能なツール","データベースのスキーマ","CSSのスタイル定義","DNSレコード"],correct:0,explanation:"サブエージェント定義のfrontmatterには名前・説明・利用可能ツールなどのメタ情報を記述する。",diagram:"subagent_isolation"},
{domain:"Claude Code設定・ワークフロー",text:"Claude Codeで「プランモード」を使う主な目的は何か？",choices:["コードを変更する前に実装方針をレビューし、合意を得てから実行に移る","すべてのファイルを自動的に削除する","テストを無効化する","Gitの履歴を書き換える"],correct:0,explanation:"プランモードは実装に着手する前に方針をユーザーと合意するための機能であり、意図しない変更を防ぐ。",diagram:"permission_hooks"},
{domain:"Claude Code設定・ワークフロー",text:"Claude CodeにおいてMEMORY.mdやメモリファイルを使う目的として適切なのはどれか？",choices:["セッションをまたいでユーザーの好みやプロジェクトの背景を永続的に記録する","一時的なデバッグ出力を保存するためだけに使う","APIキーを保存する","ソースコードの代わりに使う"],correct:0,explanation:"メモリファイルは会話セッションをまたいで再利用したい知識や好みを永続化するための仕組みである。",diagram:"claude_code_config"},
{domain:"プロンプトエンジニアリング・構造化出力",text:"モデルに厳密なJSON形式で出力させたい場合、最も効果的な指示方法はどれか？",choices:["期待する出力のスキーマや具体例を明示し、余分なテキストを含めないよう明確に指示する","何も指示せずモデルの判断に任せる","出力形式について一切触れない","常に自然文で応答させる"],correct:0,explanation:"出力スキーマや具体例を明示することで、モデルが期待通りの構造化出力を返す精度が高まる。",diagram:"structured_output_schema"},
{domain:"プロンプトエンジニアリング・構造化出力",text:"システムプロンプトとユーザープロンプトの役割の違いとして正しいものはどれか？",choices:["システムプロンプトはモデルの全体的な振る舞いや役割を設定し、ユーザープロンプトは個別のリクエストを伝える","両者は完全に同じ役割を持つ","システムプロンプトは画像入力にのみ使われる","ユーザープロンプトはモデルの重みを変更する"],correct:0,explanation:"システムプロンプトは全体的な役割・振る舞いの設定に使われ、ユーザープロンプトは個々のリクエスト内容を伝える。",diagram:"system_vs_user_prompt"},
{domain:"プロンプトエンジニアリング・構造化出力",text:"Few-shot（少数例）プロンプティングの利点は何か？",choices:["期待する出力形式やスタイルを具体例で示すことで精度を高められる","トークン数を必ずゼロにできる","モデルのファインチューニングと同義である","常にレイテンシを短縮する"],correct:0,explanation:"少数の具体例を示すことで、モデルが期待する出力形式やスタイルを学習しやすくなる。",diagram:"structured_output_schema"},
{domain:"プロンプトエンジニアリング・構造化出力",text:"XMLタグ（例: <thinking>や<answer>）を使ってプロンプトを構造化する主な利点はどれか？",choices:["モデルが指示内容と出力箇所を明確に区別しやすくなる","トークンを消費しなくなる","モデルが画像を生成できるようになる","APIレスポンスの暗号化に必要である"],correct:0,explanation:"XMLタグを用いることでプロンプト内の指示・例・出力領域を明確に区切ることができ、モデルの理解精度が向上する。",diagram:"structured_output_schema"},
{domain:"プロンプトエンジニアリング・構造化出力",text:"「chain-of-thought（思考の連鎖）」プロンプティングが有効なのはどのような場合か？",choices:["複雑な推論や多段階の計算を要するタスク","単純な単語の翻訳のみのタスク","画像フォーマットの変換のみのタスク","常にすべてのタスクで無効である"],correct:0,explanation:"複雑な推論や多段階の計算を要するタスクでは、途中の思考過程を明示させることで精度が向上しやすい。",diagram:"structured_output_schema"},
{domain:"プロンプトエンジニアリング・構造化出力",text:"プロンプトで出力の一貫性を高めるために「negative instruction（禁止事項）」よりも推奨される手法はどれか？",choices:["望ましい振る舞いを肯定形で具体的に指示する","何も指示しない","禁止事項だけを羅列する","出力例を一切示さない"],correct:0,explanation:"「〜するな」という否定的指示よりも「〜せよ」という肯定的で具体的な指示の方がモデルは従いやすい。",diagram:"structured_output_schema"},
{domain:"プロンプトエンジニアリング・構造化出力",text:"構造化出力を得るためにTool useの「入力スキーマ」を使う利点は何か？",choices:["モデルの出力を事前定義したJSONスキーマに強制的に整合させやすい","モデルが画像しか出力できなくなる","レイテンシが必ずゼロになる","ツールを使うとプロンプトが不要になる"],correct:0,explanation:"Tool useの入力スキーマを利用すると、モデルの出力を定義済みの構造に沿わせやすくなり、パースの信頼性が向上する。",diagram:"structured_output_schema"},
{domain:"プロンプトエンジニアリング・構造化出力",text:"長いコンテキストを扱う際、重要な指示をプロンプトの末尾近くに置くことが推奨される理由は何か？",choices:["一般にモデルは直近の指示に強く注意を向けやすいため","先頭の情報は自動的に破棄されるため","末尾に置かないとAPIがエラーを返すため","理由は特にない"],correct:0,explanation:"長いコンテキストでは、末尾に近い指示ほどモデルが注意を向けやすい傾向があるため、重要な指示は末尾付近に配置することが推奨される。",diagram:"structured_output_schema"},
{domain:"ツール設計・MCP統合",text:"MCP（Model Context Protocol）の主な目的は何か？",choices:["LLMアプリケーションと外部データソース・ツールを標準化された方法で接続する","モデルの学習データを暗号化する","GPUのメモリ使用量を最適化する","UIのレンダリングを高速化する"],correct:0,explanation:"MCPはLLMアプリケーションが外部のデータソースやツールに標準化された方法で接続するためのオープンプロトコルである。",diagram:"mcp_architecture"},
{domain:"ツール設計・MCP統合",text:"MCPサーバーが提供できるプリミティブとして代表的でないものはどれか？",choices:["Resources、Tools、Promptsのいずれか","ニューラルネットワークの重み更新","Resources","Tools"],correct:1,explanation:"MCPサーバーはResources、Tools、Promptsなどのプリミティブを提供するが、モデルの重み更新は対象ではない。",diagram:"mcp_architecture"},
{domain:"ツール設計・MCP統合",text:"ツール（関数）の説明文（description）を書く際のベストプラクティスはどれか？",choices:["いつ・なぜそのツールを使うべきかを具体的かつ明確に記述する","できるだけ曖昧にしてモデルの自由度を高める","説明を省略し名前だけで判断させる","他のツールと重複する説明を避けずそのまま流用する"],correct:0,explanation:"ツールの説明文は使用条件や目的を具体的に記述することで、モデルが適切にツールを選択・利用できるようになる。",diagram:"tool_call_flow"},
{domain:"ツール設計・MCP統合",text:"複数のツールが似た機能を持つ場合に起こりやすい問題はどれか？",choices:["モデルがどのツールを選ぶべきか混乱し、誤った呼び出しをする可能性が高まる","常にレイテンシが短縮される","トークン消費が必ずゼロになる","問題は一切発生しない"],correct:0,explanation:"機能が重複するツールが多いと、モデルが適切なツールを選択しづらくなり誤呼び出しのリスクが高まる。",diagram:"tool_call_flow"},

// ---- パターン別概念図（SVG） ----
const SVG_NS = "http://www.w3.org/2000/svg";
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function svgBox(x, y, w, h, label, alt) {
  const fill = alt ? '#E6F4EA' : '#EEF2FF';
  const border = alt ? '#34A853' : '#4F63D2';
  const lines = String(label).split('\n');
  const lineHeight = 13;
  const startY = y + h / 2 - (lines.length - 1) * lineHeight / 2 + 4;
  let text = '';
  lines.forEach((line, i) => {
    text += `<text x="${x + w / 2}" y="${startY + i * lineHeight}" text-anchor="middle" font-size="11" fill="#222">${esc(line)}</text>`;
  });
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${fill}" stroke="${border}" stroke-width="1.5"/>${text}`;
}

function svgDiamond(cx, cy, w, h, label) {
  const points = `${cx},${cy - h/2} ${cx + w/2},${cy} ${cx},${cy + h/2} ${cx - w/2},${cy}`;
  return `<polygon points="${points}" fill="#FFF3CD" stroke="#C99A06" stroke-width="1.5"/>` +
    `<text x="${cx}" y="${cy + 4}" text-anchor="middle" font-size="11" fill="#222">${esc(label)}</text>`;
}

function svgArrow(x1, y1, x2, y2, label) {
  let s = `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>`;
  if (label) {
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    s += `<rect x="${mx - label.length * 3.2 - 2}" y="${my - 10}" width="${label.length * 6.4 + 4}" height="13" fill="white"/>`;
    s += `<text x="${mx}" y="${my}" text-anchor="middle" font-size="10" fill="#555">${esc(label)}</text>`;
  }
  return s;
}

function svgCurveBack(x1, y1, x2, y2, cx1, cy1, cx2, cy2, label) {
  let s = `<path d="M ${x1} ${y1} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${x2} ${y2}" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>`;
  if (label) {
    s += `<text x="${(x1 + x2) / 2}" y="${Math.min(cy1, cy2) - 4}" text-anchor="middle" font-size="10" fill="#555">${esc(label)}</text>`;
  }
  return s;
}

function svgLabel(x, y, label) {
  return `<text x="${x}" y="${y}" text-anchor="middle" font-size="10" fill="#555">${esc(label)}</text>`;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/**
 * ドメインごとの出題比率(DOMAIN_RATIO)を維持したまま、指定数の問題をランダムに抽出する。
 * 最大剰余法で端数を配分し、各ドメインのプール数を超えないようにする。
 */
function selectExamQuestions(count) {
  const byDomain = {};
  for (const domain of Object.keys(DOMAIN_RATIO)) {
    byDomain[domain] = shuffle(QUESTIONS.filter(q => q.domain === domain));
  }

  const ratioSum = Object.values(DOMAIN_RATIO).reduce((a, b) => a + b, 0);
  const baseCounts = {};
  const remainders = {};
  let allocated = 0;
  for (const [domain, ratio] of Object.entries(DOMAIN_RATIO)) {
    const poolSize = byDomain[domain].length;
    const ideal = count * (ratio / ratioSum);
    let base = Math.min(Math.floor(ideal), poolSize);
    baseCounts[domain] = base;
    remainders[domain] = ideal - base;
    allocated += base;
  }

  let remaining = count - allocated;
  const byRemainderDesc = Object.keys(DOMAIN_RATIO).sort((a, b) => remainders[b] - remainders[a]);
  for (const domain of byRemainderDesc) {
    if (remaining <= 0) break;
    if (baseCounts[domain] < byDomain[domain].length) {
      baseCounts[domain]++;
      remaining--;
    }
  }
  // プール枯渇などで端数が余った場合は、余力のあるドメインに順番に割り当てる
  while (remaining > 0) {
    let progressed = false;
    for (const domain of Object.keys(DOMAIN_RATIO)) {
      if (remaining <= 0) break;
      if (baseCounts[domain] < byDomain[domain].length) {
        baseCounts[domain]++;
        remaining--;
        progressed = true;
      }
    }
    if (!progressed) break;
  }

  let result = [];
  for (const [domain, n] of Object.entries(baseCounts)) {
    result = result.concat(byDomain[domain].slice(0, n));
  }
  return shuffle(result);
}

document.getElementById('startBtn').addEventListener('click', () => {
  let count = parseInt(document.getElementById('countInput').value, 10);
  if (!count || count < 1) count = 1;
  if (count > QUESTIONS.length) count = QUESTIONS.length;

  session = selectExamQuestions(count);
  currentIndex = 0;
  correctCount = 0;
  domainStats = {};
  missed = [];
  examFinished = false;

  startCard.classList.add('hidden');
  resultCard.classList.add('hidden');
  questionCard.classList.remove('hidden');
  showQuestion();
  startTimer();
});

function startTimer() {
  stopTimer();
  remainingSeconds = TIME_LIMIT_SECONDS;
  updateTimerLabel();
  timerHandle = setInterval(() => {
    remainingSeconds--;
    updateTimerLabel();
    if (remainingSeconds <= 0) {
      stopTimer();
      handleTimeUp();
    }
  }, 1000);
}

function stopTimer() {
  if (timerHandle) {
    clearInterval(timerHandle);
    timerHandle = null;
  }
}

function updateTimerLabel() {
  const m = String(Math.max(remainingSeconds, 0) / 60 | 0).padStart(2, '0');
  const s = String(Math.max(remainingSeconds, 0) % 60).padStart(2, '0');
  timerLabelEl.textContent = `残り時間: ${m}:${s}`;
  timerLabelEl.style.color = remainingSeconds <= 300 ? '#ea4335' : '';
}

function handleTimeUp() {
  if (examFinished) return;

  // 未回答分（現在の問題が未回答ならそれ以降）を不正解として集計する
  const startUnanswered = answered ? currentIndex + 1 : currentIndex;
  for (let i = startUnanswered; i < session.length; i++) {
    const q = session[i];
    domainStats[q.domain] = domainStats[q.domain] || { correct: 0, total: 0 };
    domainStats[q.domain].total++;
    missed.push(q);
  }

  bringWindowToFront();
  alert('制限時間（120分）に達したため、試験を自動終了します。');
  showResult();
}

function bringWindowToFront() {
  // ブラウザの制約上、他アプリの最前面には出せないが、可能な範囲でウィンドウにフォーカスを戻す
  window.focus();
  const originalTitle = document.title;
  let flashCount = 0;
  const flashHandle = setInterval(() => {
    document.title = (flashCount % 2 === 0) ? '⏰ 時間切れ！ - ' + originalTitle : originalTitle;
    flashCount++;
    if (flashCount > 6) {
      clearInterval(flashHandle);
      document.title = originalTitle;
    }
  }, 500);
}

function showQuestion() {
  answered = false;
  const q = session[currentIndex];
  document.getElementById('progress').textContent = `問題 ${currentIndex + 1} / ${session.length}`;
  document.getElementById('domainLabel').textContent = `分野: ${q.domain}`;
  renderDiagram(q.diagram);
  document.getElementById('qtext').textContent = `${currentIndex + 1}. ${q.text}`;

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];
  q.choices.forEach((choice, i) => {
    const label = document.createElement('label');
    label.className = 'choice';
    label.innerHTML = `<input type="radio" name="choice" value="${i}"> ${letters[i]}. ${choice}`;
    choicesEl.appendChild(label);
  });

  feedbackEl.className = 'feedback hidden';
  feedbackEl.textContent = '';
  answerBtn.disabled = false;
  nextBtn.disabled = true;
}

answerBtn.addEventListener('click', () => {
  if (answered || examFinished) return;
  const selectedInput = document.querySelector('input[name="choice"]:checked');
  if (!selectedInput) {
    alert('選択肢を1つ選んでください。');
    return;
  }
  answered = true;
  const selected = parseInt(selectedInput.value, 10);
  const q = session[currentIndex];
  const labels = document.querySelectorAll('#choices label.choice');
  labels.forEach(l => l.querySelector('input').disabled = true);

  domainStats[q.domain] = domainStats[q.domain] || { correct: 0, total: 0 };
  domainStats[q.domain].total++;

  labels[q.correct].classList.add('correct');
  const isCorrect = selected === q.correct;
  const caption = DIAGRAM_CAPTIONS[q.diagram] || '';
  const diagramNote = caption
    ? `<div style="margin-top:8px; padding-top:8px; border-top:1px dashed #bbb; font-size:0.9em;">🖼 <strong>図解でおさらい:</strong> ${esc(caption)}（上の図も参照してください）</div>`
    : '';
  if (isCorrect) {
    correctCount++;
    domainStats[q.domain].correct++;
    feedbackEl.className = 'feedback correct';
    feedbackEl.innerHTML = `<strong>✅ 正解！</strong><br>${esc(q.explanation)}${diagramNote}`;
  } else {
    labels[selected].classList.add('wrong');
    missed.push(q);
    feedbackEl.className = 'feedback wrong';
    feedbackEl.innerHTML = `<strong>❌ 不正解。正解は ${['A','B','C','D'][q.correct]} です。</strong><br>${esc(q.explanation)}${diagramNote}`;
  }

  answerBtn.disabled = true;
  nextBtn.disabled = false;
});

nextBtn.addEventListener('click', () => {
  if (examFinished) return;
  currentIndex++;
  if (currentIndex >= session.length) {
    stopTimer();
    showResult();
  } else {
    showQuestion();
  }
});

function showResult() {
  examFinished = true;
  stopTimer();
  questionCard.classList.add('hidden');
  resultCard.classList.remove('hidden');

  const total = session.length;
  const pct = total === 0 ? 0 : (100 * correctCount / total).toFixed(1);
  document.getElementById('resultSummary').textContent = `結果: ${correctCount} / ${total} 正解 (${pct}%)`;

  const statsEl = document.getElementById('domainStats');
  let statsHtml = '<p><strong>【分野別成績】</strong></p>';
  for (const [domain, s] of Object.entries(domainStats)) {
    statsHtml += `<div>・${domain}: ${s.correct} / ${s.total}</div>`;
  }
  statsEl.innerHTML = statsHtml;

  const missedEl = document.getElementById('missedList');
  if (missed.length === 0) {
    missedEl.innerHTML = '<p><strong>全問正解です！</strong></p>';
  } else {
    let html = '<p><strong>【誤答・未回答だった問題】</strong></p>';
    missed.forEach(q => {
      html += `<div class="item">${q.text}<br><span style="color:#34a853;">正解: ${q.choices[q.correct]}</span></div>`;
    });
    missedEl.innerHTML = html;
  }
}

document.getElementById('retryBtn').addEventListener('click', () => {
  resultCard.classList.add('hidden');
  startCard.classList.remove('hidden');
});
</script>
</body>
</html>
