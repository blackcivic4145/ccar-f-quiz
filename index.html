{domain:"Agentic Architecture",text:"Why should it first be considered, when designing an agent workflow, whether a given step \"could be replaced by deterministic code\"?",choices:["Because for processing that requires certainty and reproducibility, ordinary code is often superior to an LLM call in terms of reliability and cost","LLM calls are always faster than code","Implementing something in code is usually technically impossible","Deterministic code should always be avoided because it undermines the \"agentic\" feel"],correct:0,explanation:"Processing that requires certainty and reproducibility is often more reliable and cost-effective with ordinary code than with an LLM call, which is why this should be considered first.",diagram:"orchestrator_worker"},
{domain:"Agentic Architecture",text:"In a multi-agent configuration, what is the risk of the call hierarchy between agents becoming too deep (multiple layers of subagents of subagents)?",choices:["Debugging becomes difficult, and latency and cost accumulate, making management more complex","Deeper hierarchies always improve accuracy","Hierarchy depth has no effect at all on cost","Deepening the hierarchy is a recommended best practice"],correct:0,explanation:"If the call hierarchy becomes too deep, debugging becomes difficult and latency and cost accumulate, making management more complex.",diagram:"subagent_isolation"},
{domain:"Agentic Architecture",text:"What problem tends to occur when the goal given to an agent is described too abstractly?",choices:["Interpretations of how to achieve the goal vary, increasing the likelihood of unintended behavior","An abstract goal is always achieved more accurately","The abstraction level of the goal has no effect at all on the result","Using an abstract goal always lowers cost"],correct:0,explanation:"If a goal is described too abstractly, interpretations of how to achieve it vary, increasing the likelihood that the agent takes unintended action.",diagram:"orchestrator_worker"},
{domain:"Agentic Architecture",text:"What is the benefit of a design that allows simulating (dry-running) changes an agent would make to the external environment (such as the file system) before executing them?",choices:["The scope of impact can be checked before actually applying the change, preventing unintended destructive changes","A dry run is always slower than actual execution and pointless","Performing a dry run always causes an error","A dry run contributes nothing at all to safety"],correct:0,explanation:"Being able to check the scope of impact via a dry run before actually applying a change can prevent unintended destructive changes.",diagram:"orchestrator_worker"},
{domain:"Agentic Architecture",text:"Which statement correctly describes combining multiple agent patterns (routing, parallelization, orchestrator, etc.) within a single workflow?",choices:["Combining multiple patterns according to the nature of the task allows more complex requirements to be addressed","Only one pattern can be used within a single workflow","Combining patterns always causes an error","Combining patterns is prohibited by specification"],correct:0,explanation:"Combining multiple agent patterns according to the nature of the task allows building a workflow that can address more complex requirements.",diagram:"orchestrator_worker"},
{domain:"Claude Code Configuration & Workflow",text:"In Claude Code, when combining multiple subagents to advance one large task, what is the benefit of giving each subagent a clear division of responsibility?",choices:["Responsibility boundaries become clear, reducing gaps or duplication in the task","Dividing responsibilities always slows processing","Dividing responsibilities only affects cost and is unrelated to quality","Dividing responsibilities makes it possible to use only a single subagent"],correct:0,explanation:"Giving each subagent a clear division of responsibility makes responsibility boundaries clear, reducing gaps or duplication in the task.",diagram:"subagent_isolation"},
{domain:"Claude Code Configuration & Workflow",text:"What is the benefit of documenting the project's technology stack and directory structure in CLAUDE.md in Claude Code?",choices:["You avoid repeating the same explanation every time and can proceed with tasks using consistent context","Documenting it always reduces the file size","Documenting the technology stack only increases security risk","What is written in CLAUDE.md has no effect at all on Claude Code's behavior"],correct:0,explanation:"Documenting the technology stack and directory structure in CLAUDE.md avoids repeating the same explanation every time and allows tasks to proceed with consistent context.",diagram:"claude_code_config"},
{domain:"Claude Code Configuration & Workflow",text:"Why is it recommended to have Claude Code broadly investigate related files before making changes to an existing codebase?",choices:["Making changes after understanding the existing design and conventions avoids inconsistent implementation","Investigation is always a waste of time and should be skipped","Investigation always causes an error","Investigation has no effect at all on code quality"],correct:0,explanation:"Broadly investigating related files before making a change allows changes to be made with an understanding of the existing design and conventions, avoiding inconsistent implementation.",diagram:"claude_code_config"},
{domain:"Claude Code Configuration & Workflow",text:"What is the benefit of feeding the results of a linter or formatter back as feedback to Claude Code to improve the quality of generated code?",choices:["Mechanically detectable problems can be fixed early, reducing the effort needed for review","Feeding back linter results always halts code generation","Using a linter is unrelated to code quality","Feeding back formatter results always makes the output unstable"],correct:0,explanation:"Feeding linter or formatter results back as feedback allows mechanically detectable problems to be fixed early, reducing review effort.",diagram:"claude_code_config"},
{domain:"Claude Code Configuration & Workflow",text:"What is the benefit of having Claude Code implement a large feature addition incrementally, broken into small units?",choices:["Behavior can be verified at each stage, making it easier to catch and fix problems early","Breaking it up always only extends the development period with no benefit","An incremental implementation is always inferior in quality to a single, all-at-once implementation","Incremental implementation is impossible by specification"],correct:0,explanation:"Implementing a large feature addition incrementally, in small units, allows behavior to be verified at each stage, making it easier to catch and fix problems early.",diagram:"claude_code_config"},
{domain:"Claude Code Configuration & Workflow",text:"Why is it important to take care not to include sensitive information (such as API keys) in prompts or commits in Claude Code?",choices:["Because leaking sensitive information can lead to misuse or a security incident","Including sensitive information has no technical impact at all","Managing sensitive information is unrelated to Claude Code's features","Sensitive information included in a commit is automatically encrypted safely"],correct:0,explanation:"Since leaked sensitive information such as API keys can lead to misuse or a security incident, it is important to take care not to include it in prompts or commits.",diagram:"claude_code_config"},
{domain:"Claude Code Configuration & Workflow",text:"What is the problem with passing a tool's execution results (such as test failure logs) unsummarized directly to the next step in Claude Code?",choices:["The verbose information consumes context, and the important cause of failure can get buried","Passing it as-is always produces higher accuracy","Summarizing it falsifies the test results","There is no particular problem"],correct:0,explanation:"Passing test failure logs unsummarized directly to the next step consumes context with verbose information and risks burying the important cause of failure.",diagram:"tool_call_flow"},
{domain:"Claude Code Configuration & Workflow",text:"In what situation is a design that has Claude Code compare and consider multiple candidate implementations before adoption effective?",choices:["When the design approach has multiple valid options and comparing the trade-offs has high value","For literally every small change, no matter how minor","Comparing multiple candidates is always a waste of time","Comparative consideration is prohibited for security reasons"],correct:0,explanation:"When the design approach has multiple valid options and comparing trade-offs has high value, having multiple candidate implementations compared and considered is effective.",diagram:"claude_code_config"},
{domain:"Claude Code Configuration & Workflow",text:"Why is it recommended to always run tests and check the results after making a change in Claude Code?",choices:["Because it allows mechanical verification that existing functionality has not been broken, catching regressions early","Running tests is always an unnecessary cost","Running tests always breaks the code","Test results are unrelated to quality"],correct:0,explanation:"Running tests after a change allows mechanical verification that existing functionality has not been broken, catching regressions early.",diagram:"claude_code_config"},
{domain:"Claude Code Configuration & Workflow",text:"Why is it effective to ask clarifying questions when receiving an ambiguous request in an interaction with Claude Code?",choices:["It prevents implementation based on a misunderstanding and reduces rework","Asking questions always only wastes time","An ambiguous request is always implemented more accurately as-is","Clarifying questions cannot be used, by Claude Code's specification"],correct:0,explanation:"Asking clarifying questions when receiving an ambiguous request prevents implementation based on a misunderstanding and reduces rework.",diagram:"claude_code_config"},
{domain:"Prompt Engineering & Structured Output",text:"What is the benefit of showing both a \"good output example\" and a \"bad output example\" in a prompt?",choices:["It conveys both the desired standard and the pattern to avoid concretely, which tends to improve accuracy","Showing a bad example always makes the model output exactly that way","Showing both good and bad examples is prohibited by prompt specification","Showing examples has no effect by itself"],correct:0,explanation:"Showing both good and bad examples conveys both the desired standard and the pattern to avoid concretely, tending to improve output accuracy.",diagram:"structured_output_schema"},
{domain:"Prompt Engineering & Structured Output",text:"When requesting a summary of a long document from the model, what is the benefit of specifically specifying the summary's length and focus?",choices:["It becomes easier to obtain a summary matching the desired level of detail and focus","Specifying a length always causes the process to fail","Specifying a focus has no effect at all on summary quality","Not specifying anything always produces a higher-accuracy summary"],correct:0,explanation:"Specifically specifying the summary's length and focus makes it easier to obtain a summary matching the desired level of detail and focus.",diagram:"structured_output_schema"},
{domain:"Prompt Engineering & Structured Output",text:"What is the effect of instructing in a prompt, \"If you don't know, say so rather than guessing\"?",choices:["It reduces unfounded assertions (hallucination) and makes the model more likely to honestly convey uncertainty","This instruction always reduces the output token count to zero","Giving this instruction always makes the model respond incorrectly","Reporting uncertainty is technically impossible"],correct:0,explanation:"Instructing the model not to guess but to say so when it does not know reduces unfounded assertions and makes it more likely to honestly convey uncertainty.",diagram:"structured_output_schema"},
{domain:"Prompt Engineering & Structured Output",text:"When requesting a translation task from the model, what is the benefit of specifying the target audience and tone (formal/casual, etc.)?",choices:["It becomes easier to obtain a translation result matching the desired tone and word choice","Specifying the audience and tone always lowers translation accuracy","Specifying the target audience has no effect at all on the translation result","Specifying tone is not possible, by API specification"],correct:0,explanation:"Specifying the target audience and tone makes it easier to obtain a translation result matching the desired tone and word choice.",diagram:"structured_output_schema"},
{domain:"Prompt Engineering & Structured Output",text:"Why is it important to test a prompt with a diverse range of input patterns, including edge cases?",choices:["Because it allows discovering weaknesses or defects in advance that would not be found with typical inputs alone","Testing edge cases has no relevance at all to production use","Verifying with diverse inputs is always a wasted effort","Testing typical inputs alone is sufficient, with no additional verification needed"],correct:0,explanation:"Testing with a diverse range of input patterns allows discovering weaknesses or defects in advance that would not be found with typical inputs alone.",diagram:"structured_output_schema"},
{domain:"Prompt Engineering & Structured Output",text:"When having the model handle input that mixes multiple languages, why is it desirable to explicitly specify the output language?",choices:["To prevent the output from being unintentionally influenced by the input language","Specifying the output language has no effect at all on the result","Input in multiple languages is technically impossible to process","Specifying the language always causes an error"],correct:0,explanation:"Explicitly specifying the output language prevents the output from being unintentionally produced in a language influenced by the input.",diagram:"structured_output_schema"},
{domain:"Prompt Engineering & Structured Output",text:"What is the risk of expressing evaluation criteria in a prompt using only abstract adjectives (such as \"good\" or \"appropriate\")?",choices:["The evaluation criteria are interpreted differently by different people, causing the model's judgment to become inconsistent","Abstract expressions always produce more consistent results","This risk never occurs, due to the API specification","Using abstract adjectives always shortens the output"],correct:0,explanation:"Expressing evaluation criteria with only abstract adjectives causes them to be interpreted differently by different people, making the model's judgment inconsistent.",diagram:"structured_output_schema"},
{domain:"Prompt Engineering & Structured Output",text:"When requesting code generation from the model, what is the benefit of specifying the expected language version and libraries to use?",choices:["It reduces syntax or API misuse that doesn't fit the environment","Specifying a version always causes code generation to be refused","Specifying the libraries to use is unrelated to code quality","Being explicit always only slows generation with no benefit"],correct:0,explanation:"Specifying the expected language version and libraries to use reduces syntax or API misuse that doesn't fit the environment.",diagram:"structured_output_schema"},
{domain:"Prompt Engineering & Structured Output",text:"What is an effective instruction for suppressing the common \"opening preamble\" in model output (such as \"Sure, I'd be happy to\")?",choices:["Explicitly instruct it to output directly from the conclusion or the specified format, without any preamble","The preamble cannot be controlled through instructions","Allowing the preamble always results in higher-quality output","Whether a preamble is present has no effect at all on parsing structured output"],correct:0,explanation:"Explicitly instructing the model to output directly from the conclusion or specified format, without a preamble, makes it easier to suppress the opening preamble.",diagram:"structured_output_schema"},
{domain:"Prompt Engineering & Structured Output",text:"When only the output format of an intermediate step in a multi-step prompt is changed, why should the entire final output always be retested?",choices:["Because the change to the intermediate step's output format may affect the interpretation or result of subsequent steps","Because intermediate steps have no effect at all on the final output, so retesting is unnecessary","Because retesting is always a waste of time and should be skipped","Because a change to the output format always improves accuracy, so no confirmation is needed"],correct:0,explanation:"Because a change to an intermediate step's output format may affect the interpretation or result of subsequent steps, the entire final output should be retested.",diagram:"structured_output_schema"},
{domain:"Tool Design & MCP Integration",text:"What is the benefit of a design that has the model self-check the validity of input parameters before calling a tool?",choices:["It can prevent calls with obviously invalid parameters, reducing unnecessary errors","Self-checking always only slows processing with no benefit","Self-checking is technically impossible","Self-checking makes it impossible to call the tool"],correct:0,explanation:"Having the model self-check the validity of input parameters before a call can prevent calls with obviously invalid parameters, reducing unnecessary errors.",diagram:"tool_call_flow"},
{domain:"Tool Design & MCP Integration",text:"When designing tool calls that span multiple steps (e.g., search -> fetch details), what is the benefit of explicitly showing the model the intermediate results?",choices:["It becomes easier for the model to appropriately judge which tool and arguments to call next","Hiding intermediate results always produces higher accuracy","Showing intermediate results makes the tool stop working","Visualizing intermediate results only affects cost and is unrelated to accuracy"],correct:0,explanation:"Explicitly showing intermediate results makes it easier for the model to appropriately judge which tool and arguments to call next.",diagram:"tool_call_flow"},
{domain:"Tool Design & MCP Integration",text:"What is the benefit of unifying the naming convention (verb + object, etc.) for tools provided by an MCP server?",choices:["It becomes easier for the model to infer a tool's function from its name, reducing misuse","Unifying the naming convention has no effect at all on the model's behavior","Unifying the naming convention increases the tool's execution speed","A unified naming convention is prohibited by the MCP specification"],correct:0,explanation:"Unifying the naming convention for tools makes it easier for the model to infer function from name, reducing misuse.",diagram:"mcp_architecture"},
{domain:"Tool Design & MCP Integration",text:"What is the benefit of including candidate next actions (e.g., related tools that can be called next) in a tool's response?",choices:["It becomes easier for the model to judge the next step, improving task continuity","Including candidates always reduces the response size","Including candidate next actions is technically impossible under the MCP specification","Including candidates has no effect at all on judgment"],correct:0,explanation:"Including candidate next actions in a response makes it easier for the model to judge the next step, improving task continuity.",diagram:"tool_call_flow"},
{domain:"Tool Design & MCP Integration",text:"When deprecating a tool and replacing it with a new one, what is the benefit of letting both coexist for a period of time?",choices:["It prevents existing callers from suddenly breaking and allows for a gradual migration","Letting them coexist always increases security risk","Coexistence of a deprecated tool is not permitted under MCP","Coexistence has no effect at all on ease of migration"],correct:0,explanation:"Letting the old and new tools coexist for a period of time prevents existing callers from suddenly breaking and allows for a gradual migration.",diagram:"tool_call_flow"},
{domain:"Tool Design & MCP Integration",text:"What design consideration is needed when a tool call's arguments may contain sensitive information (such as personal data)?",choices:["Applying masking or minimization so sensitive information is not unnecessarily exposed in logs or external transmission","It is fine to leave sensitive information in logs as-is","Consideration for sensitive information is outside the scope of MCP and unnecessary","It is technically impossible for arguments to contain sensitive information under MCP"],correct:0,explanation:"When arguments may contain sensitive information, masking or minimization should be applied so it is not unnecessarily exposed in logs or external transmission.",diagram:"tool_call_flow"},
{domain:"Tool Design & MCP Integration",text:"What is the benefit of designing each tool to have a single responsibility (one clear function) when combining multiple tools to achieve one goal?",choices:["The behavior of individual tools becomes more predictable, making it easier to handle complex tasks through combination","Enforcing single responsibility always reduces the number of tools","The single-responsibility principle cannot be applied to MCP tool design","Enforcing single responsibility always reduces call speed"],correct:0,explanation:"Designing each tool to have a single responsibility makes individual behavior more predictable and makes it easier to handle complex tasks through combination.",diagram:"tool_call_flow"},
{domain:"Tool Design & MCP Integration",text:"What is the purpose of setting a rate limit (a limit on the number of calls) on the MCP server side?",choices:["To prevent resource exhaustion or service overload from excessive calls","Setting a rate limit improves the tool's accuracy","Rate limiting cannot be implemented under the MCP protocol","A rate limit means the same thing as authentication"],correct:0,explanation:"Setting a rate limit prevents resource exhaustion or service overload caused by excessive calls.",diagram:"mcp_architecture"},
{domain:"Tool Design & MCP Integration",text:"What is the benefit of also documenting \"situations in which the tool should not be used\" in a tool's description?",choices:["It helps prevent calls in the wrong context and encourages proper differentiation from other appropriate tools","Documenting situations not to use it makes the tool unusable","Including negative information in the description violates the MCP specification","Documenting situations not to use it has no effect at all on accuracy"],correct:0,explanation:"Also documenting \"situations in which the tool should not be used\" in the description helps prevent calls in the wrong context and encourages proper differentiation from other appropriate tools.",diagram:"tool_call_flow"},
{domain:"Context Management & Reliability",text:"In a long session where context has grown large, why is it important to keep retaining a summary of the \"original goal/requirements,\" not just the most recent exchanges?",choices:["To prevent the risk of losing sight of the original goal as the conversation progresses and responding in a way that has drifted off course","The original goal automatically becomes unnecessary over time, so retaining it is meaningless","Retaining the goal is unrelated to context management","Retaining the original requirements always only slows processing with no benefit"],correct:0,explanation:"Continuing to retain a summary of the original goal/requirements prevents the risk of losing sight of it as the conversation progresses and responding in a way that has drifted off course.",diagram:"claude_code_config"},
{domain:"Context Management & Reliability",text:"What is an appropriate measure for improving reliability when the model's responses are unstable (results vary greatly for the same question)?",choices:["Making the output format strict, lowering the temperature, and, if necessary, generating multiple times to use majority vote or verification","Taking no countermeasures and continuing operation as-is","Response instability is a problem that cannot be addressed","Stabilizing it by maximizing the temperature parameter"],correct:0,explanation:"Combining a strict output format, temperature adjustment, and majority vote/verification across multiple generations can improve response instability.",diagram:"context_compaction"},
{domain:"Context Management & Reliability",text:"What is the benefit of a design (graceful degradation) in an agent system that continues operating with some functionality limited when an external service fails?",choices:["The entire system can avoid coming to a complete stop even when some dependency is unavailable","The entire system should always be stopped during a failure, and partial continuation is unnecessary","Graceful degradation is unrelated to reliability design","Introducing this design always only increases cost with no benefit"],correct:0,explanation:"Introducing graceful degradation allows the entire system to avoid coming to a complete stop even when some dependency is unavailable.",diagram:"context_compaction"},
{domain:"Context Management & Reliability",text:"Why is it important to manage the freshness (currency) of external documents included in context?",choices:["Because it reduces the risk of giving an incorrect answer based on outdated information","Document freshness has no effect at all on answer accuracy","Using outdated information always yields more stable results","Freshness management matters only from a cost perspective"],correct:0,explanation:"Managing the freshness of external documents included in context reduces the risk of giving an incorrect answer based on outdated information.",diagram:"context_compaction"},
{domain:"Context Management & Reliability",text:"What is the benefit of periodically performing human sampling review of the model's output?",choices:["It can catch quality degradation or bias that is easily missed by automated evaluation alone","Human review is always less accurate than automated evaluation","Sampling review is nothing but a waste of cost","Human review has no effect at all on the model's behavior"],correct:0,explanation:"Periodic human sampling review can catch quality degradation or bias that is easily missed by automated evaluation alone.",diagram:"context_compaction"},
{domain:"Context Management & Reliability",text:"What is the benefit of a design in which, when conflicting information is obtained from multiple sources, the agent does not simply adopt one side but explicitly flags the conflict?",choices:["It reduces the risk of the user making a judgment based on incorrect information","Ignoring the conflict and adopting one side is always more reliable","Flagging conflicts is a feature unrelated to context management","Processing must always be halted whenever a conflict is found"],correct:0,explanation:"Explicitly flagging conflicting information reduces the risk of the user making a judgment based solely on incorrect information.",diagram:"context_compaction"},
{domain:"Context Management & Reliability",text:"What is the benefit of periodically analyzing production error logs and failure cases to continuously improve system reliability?",choices:["It allows identifying recurring problem patterns and using them to drive improvements to design or prompts","Analyzing error logs only increases operational cost and does not contribute to improvement","Analyzing failure cases is unrelated to improving reliability","Discarding error logs without analysis is the best practice"],correct:0,explanation:"Periodically analyzing production error logs and failure cases allows identifying recurring problem patterns and using them to drive improvements to design or prompts.",diagram:"tool_call_flow"},
{domain:"Agentic Architecture",text:"In an agent designed for customer support, why is it important to design the system so that certain categories (such as refunds or legal claims) are always escalated to a human operator?",choices:["Compliance requirements and high-risk decisions need to be entrusted to an authorized human","Adding escalation always lowers customer satisfaction","It is always safer to leave all decisions to the agent","Escalation mechanisms are not covered by the MCP specification, so they cannot be implemented"],correct:0,explanation:"Categories that matter for compliance, such as refunds or legal claims, must always be escalated because the decision needs to be entrusted to an authorized human.",diagram:"human_in_the_loop"},
{domain:"Agentic Architecture",text:"Why is it important for a customer support agent to strictly enforce internal policy rules, such as \"refunds up to $50 can be auto-approved\"?",choices:["To prevent the risk of the agent unilaterally carrying out actions that violate policy","Enforcing rules always makes the agent's responses slower","Enforcing policy has nothing to do with compliance","Adding rules causes the agent to stop working"],correct:0,explanation:"Strictly enforcing policies such as amount limits prevents the risk of the agent unilaterally carrying out actions that violate policy.",diagram:"permission_hooks"},
{domain:"Agentic Architecture",text:"In a multi-agent workflow where one agent's output becomes another agent's input, what is the benefit of recording the \"provenance\" of each output?",choices:["It becomes easier to trace which agent or processing step caused an incorrect result","Recording provenance only slows down processing and has no benefit","Recording provenance is prohibited for security reasons","Recording provenance automatically makes results accurate"],correct:0,explanation:"Recording the provenance of each output makes it easier to trace which agent or step caused an incorrect result when one occurs.",diagram:"orchestrator_worker"},
{domain:"Agentic Architecture",text:"In an agent workflow that includes a dependency that is temporarily unavailable, when comparing \"graceful degradation (continuing operation with reduced functionality)\" against \"immediately halting all processing,\" in what situation is the former effective?",choices:["When you want to keep providing other important functionality to users even if some features are unavailable","The former is unnecessary because any failure should always cause an immediate full stop","Graceful degradation is technically impossible to achieve","Degraded operation always only increases security risk"],correct:0,explanation:"When some features are unavailable but you still want to keep providing other important functionality, a design that gracefully degrades while continuing operation is effective.",diagram:"orchestrator_worker"},
{domain:"Agentic Architecture",text:"When a customer support agent hands off to a human operator, what is the benefit of including a summary of the conversation so far and a record of actions already taken?",choices:["It saves the human operator the effort of grasping the situation from scratch, enabling a fast and consistent response","Including a summary makes handoff impossible","Passing along records is always prohibited from a privacy standpoint","Attaching information to the handoff has no effect on response quality"],correct:0,explanation:"By handing off with a summary of the conversation and a record of actions already taken, the human operator avoids having to grasp the situation from scratch, enabling a fast and consistent response.",diagram:"human_in_the_loop"},
{domain:"Agentic Architecture",text:"In the \"orchestrator-workers\" pattern, what is the benefit of having the orchestrator dynamically determine (rather than fix in advance) the subtasks assigned to workers at runtime?",choices:["It allows flexible adjustment of the number and type of subtasks needed depending on the input","Dynamic determination only slows down processing and has no benefit","Fixing subtasks in advance always handles every situation better","Dynamic determination violates the definition of the orchestrator pattern"],correct:0,explanation:"By dynamically determining subtasks at runtime, the number and type of subtasks needed can be flexibly adjusted depending on the input.",diagram:"orchestrator_worker"},
{domain:"Agentic Architecture",text:"In a multi-agent research support workflow (where several research agents gather information and one integration agent compiles the results), why should the output format of each research agent be standardized?",choices:["So that the integration agent can more easily merge and compare multiple outputs in a consistent way","Standardizing the output format should be avoided because it eliminates each research agent's individuality","The integration process does not depend on output format, so standardization is unnecessary","Standardizing output format is a concept that MCP cannot handle"],correct:0,explanation:"Standardizing the output format of each research agent makes it easier for the integration agent to merge and compare multiple outputs in a consistent way.",diagram:"orchestrator_worker"},
{domain:"Agentic Architecture",text:"When designing an agent workflow, what is the most appropriate criterion for judging \"should this processing be handled by deterministic, rule-based logic rather than left to the agent\"?",choices:["Whether the decision can be expressed with clear rules and is always expected to produce the same result","Everything should always be left to the LLM regardless of the content of the processing","Rule-based logic cannot be used in agent systems","No such criterion exists; it should always be decided randomly"],correct:0,explanation:"Whether a decision can be expressed with clear rules and is always expected to produce the same result is the criterion for deciding whether it should be handled by deterministic logic.",diagram:"orchestrator_worker"},
{domain:"Agentic Architecture",text:"A design in which a customer support agent is controlled so it does not disclose sensitive information (such as order history) while the user's identity has not been verified falls into which category?",choices:["Agent workflow design involving guardrails (compliance controls)","The parallelization pattern","A concept unrelated to prompt chaining","A type of MCP Resources primitive"],correct:0,explanation:"A design that controls the agent so it does not disclose sensitive information before identity verification falls under agent workflow design involving guardrails (compliance controls).",diagram:"orchestrator_worker"},
{domain:"Agentic Architecture",text:"In a multi-agent system, what is the benefit of designing the system so that one agent's failure does not halt the processing of all other agents (i.e., tolerating partial failure)?",choices:["It increases overall system availability and limits the impact of a localized failure","Tolerating partial failure always corrupts data","A design that halts everything if even one agent fails is always superior","Tolerating failure has nothing to do with agent design"],correct:0,explanation:"A design that tolerates partial failure increases overall system availability and limits the impact of a localized failure.",diagram:"orchestrator_worker"},
{domain:"Agentic Architecture",text:"In an agent workflow design that combines \"routing\" and \"orchestrator-workers\" (first classifying the input, then delegating to a specialized orchestrator), in what situation is this effective?",choices:["In complex systems where the required subtask composition varies greatly depending on the type of input","In simple systems where all inputs can be handled by the same process","Combining patterns is prohibited in agent design","There is a technical constraint preventing routing and orchestrator patterns from being used together"],correct:0,explanation:"In complex systems where the required subtask composition varies greatly depending on the type of input, combining routing with the orchestrator-workers pattern is effective.",diagram:"orchestrator_worker"},
{domain:"Agentic Architecture",text:"To verify that a customer support agent's response is factually grounded, what is the benefit of having the agent cite the source of information (such as the relevant section of the knowledge base) that its answer is based on?",choices:["It becomes easier for a human to verify the accuracy of the answer, reducing the risk of misinformation","Requiring citations always makes responses too long to be practical","Citing sources has nothing to do with compliance","Requiring citations always improves processing speed"],correct:0,explanation:"Having the agent cite the source of information behind its answer makes it easier for a human to verify accuracy and reduces the risk of misinformation.",diagram:"orchestrator_worker"},
{domain:"Agentic Architecture",text:"In production operation of a multi-agent system, what is the benefit of measuring each agent's call count and cost individually?",choices:["It becomes possible to identify which agent is the source of a bottleneck or cost overrun, making optimization easier","Measuring individually always makes the whole system unstable","Measuring cost has nothing to do with multi-agent design","Measurement is technically impossible in production operation"],correct:0,explanation:"Measuring each agent's call count and cost individually makes it possible to identify the source of bottlenecks or cost overruns and optimize accordingly.",diagram:"orchestrator_worker"},
{domain:"Tool Design & MCP Integration",text:"When a tool call fails, what is the benefit of distinguishing in the response whether the error is \"transient (such as a brief network interruption)\" or \"permanent (such as invalid input)\"?",choices:["It allows the model to appropriately judge whether it should retry or take a different course of action","Making this distinction has no effect whatsoever on the model's behavior","The distinction exists so the model always judges that permanent errors should be retried","Distinguishing error types is prohibited by the MCP specification"],correct:0,explanation:"By distinguishing transient errors from permanent errors in the response, the model can appropriately judge whether to retry or take a different approach.",diagram:"tool_call_flow"},
{domain:"Tool Design & MCP Integration",text:"What is the benefit of designing a tool so that, before performing an irreversible operation (such as a money transfer or deletion), it makes the model go through a confirmation step (confirmation flow)?",choices:["It can prevent damage from incorrect arguments or execution the user did not intend","Adding a confirmation step always causes the process to fail","Irreversible operations should not have a confirmation step","A confirmation step cannot be implemented as an MCP primitive"],correct:0,explanation:"Requiring a confirmation step before an irreversible operation can prevent damage caused by incorrect arguments or execution the user did not intend.",diagram:"permission_hooks"},
{domain:"Tool Design & MCP Integration",text:"In the MCP \"trust model,\" why should a client not unconditionally trust the description text of tools provided by an MCP server it connects to?",choices:["Because a malicious server could use a misleading description to lead the model into an unintended action","Because MCP server description text is always encrypted, so there is no need to verify its trustworthiness","Because tool description text has no effect on the model's decisions, so trustworthiness is not an issue","Because the concept of a trust model does not exist in MCP"],correct:0,explanation:"Because a malicious MCP server could use a misleading description to lead the model into an unintended action, description text should not be trusted unconditionally.",diagram:"mcp_architecture"},
{domain:"Tool Design & MCP Integration",text:"What is the benefit of using different MCP configuration scopes (project-level, user-level, local-level, etc.) appropriately?",choices:["Settings that should be shared with the team and settings specific to an individual's environment can be properly separated and managed","Separating scopes always prohibits connecting to MCP servers","Configuration scope only concerns security and has nothing to do with convenience","The concept of scope does not exist in MCP"],correct:0,explanation:"Using configuration scopes appropriately allows settings that should be shared with the team to be properly separated from settings specific to an individual's environment.",diagram:"mcp_architecture"},
{domain:"Tool Design & MCP Integration",text:"When handling a tool call result that is in an \"uncertain state (such as when no response arrived due to a timeout),\" what is the benefit of explicitly conveying this as an uncertain state rather than simply treating it as a failure?",choices:["It reduces the risk of the model carelessly re-executing the same operation, causing an unintended duplicate execution","Explicitly conveying the uncertain state always speeds up processing","An uncertain state should always be treated as a success","This distinction has nothing to do with MCP or tool design"],correct:0,explanation:"Explicitly conveying the uncertain state reduces the risk of the model carelessly re-executing the same operation and causing an unintended duplicate execution.",diagram:"retry_timeout"},
{domain:"Tool Design & MCP Integration",text:"In tool use, in what situation is it effective to force the model to call a specific tool (control similar to tool_choice)?",choices:["When it is known in advance that a specific tool call is required as the next action","It is always effective when you want to leave the decision entirely to the model's free judgment","A feature to force a tool call does not exist in the API specification","Using tool_choice makes the tool's description text unnecessary"],correct:0,explanation:"When it is known in advance that a specific tool call is required as the next action, using a control that forces that tool call is effective.",diagram:"tool_call_flow"},

{domain:"Prompt Engineering & Structured Output",text:"In structured output schema design, which approach is appropriate for reducing the risk of the model filling in guessed information (hallucination) that does not actually exist in the source document?",choices:["Explicitly instruct the model to \"return null or a value indicating unknown, without guessing, when the document does not state it explicitly\"","Instruct the model to \"always fill in the most likely value when unsure\"","Including the concept of null or unknown values in the schema is not possible by specification","Setting temperature to its maximum value as a countermeasure against hallucination"],correct:0,explanation:"Explicitly instructing the model to return null or an unknown-value indicator rather than guess when the document does not state something explicitly reduces the risk of hallucination.",diagram:"structured_output_schema"},
{domain:"Context Management & Reliability",text:"In a long-running agent task, what is the benefit of performing \"progressive summarization\" instead of summarizing the entire history at once each time the context approaches its limit?",choices:["Each round of summarization can preserve recent information while gradually condensing it, avoiding a sudden loss of information","Progressive summarization always has a higher processing cost than a single full summary and should be avoided","The concept of progressive summarization does not exist in context management","Summarizing progressively always causes important information to be lost"],correct:0,explanation:"Performing progressive summarization preserves recent information while gradually condensing it with each round, avoiding a sudden loss of information.",diagram:"context_compaction"},
{domain:"Context Management & Reliability",text:"In a long-running task, what is the benefit of managing an explicit \"state object\" (structured data holding current progress, completed steps, remaining tasks, etc.) rather than relying on the conversation history itself?",choices:["It removes the need to infer progress from the conversation log each time, enabling consistent state management","Using a state object eliminates the need to retain conversation history entirely","Using a state object contributes nothing whatsoever to saving the context window","A state object is a concept that neither MCP nor Claude Code can handle"],correct:0,explanation:"Managing an explicit state object removes the need to infer progress from the conversation log each time, enabling consistent state management.",diagram:"context_compaction"},

// ---- パターン別概念図（SVG） ----
const SVG_NS = "http://www.w3.org/2000/svg";
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function svgBox(x, y, w, h, label, alt) {
  const fill = alt ? '#E6F4EA' : '#EEF2FF';
  const border = alt ? '#34A853' : '#4F63D2';
  const lines = String(label).split('\n');
  const lineHeight = 13;
  const startY = y + h / 2 - (lines.length - 1) * lineHeight / 2 + 4;
  let text = '';
  lines.forEach((line, i) => {
    text += `<text x="${x + w / 2}" y="${startY + i * lineHeight}" text-anchor="middle" font-size="11" fill="#222">${esc(line)}</text>`;
  });
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${fill}" stroke="${border}" stroke-width="1.5"/>${text}`;
}

function svgDiamond(cx, cy, w, h, label) {
  const points = `${cx},${cy - h/2} ${cx + w/2},${cy} ${cx},${cy + h/2} ${cx - w/2},${cy}`;
  return `<polygon points="${points}" fill="#FFF3CD" stroke="#C99A06" stroke-width="1.5"/>` +
    `<text x="${cx}" y="${cy + 4}" text-anchor="middle" font-size="11" fill="#222">${esc(label)}</text>`;
}

function svgArrow(x1, y1, x2, y2, label) {
  let s = `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>`;
  if (label) {
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    s += `<rect x="${mx - label.length * 3.2 - 2}" y="${my - 10}" width="${label.length * 6.4 + 4}" height="13" fill="white"/>`;
    s += `<text x="${mx}" y="${my}" text-anchor="middle" font-size="10" fill="#555">${esc(label)}</text>`;
  }
  return s;
}

function svgCurveBack(x1, y1, x2, y2, cx1, cy1, cx2, cy2, label) {
  let s = `<path d="M ${x1} ${y1} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${x2} ${y2}" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>`;
  if (label) {
    s += `<text x="${(x1 + x2) / 2}" y="${Math.min(cy1, cy2) - 4}" text-anchor="middle" font-size="10" fill="#555">${esc(label)}</text>`;
  }
  return s;
}

function svgLabel(x, y, label) {
  return `<text x="${x}" y="${y}" text-anchor="middle" font-size="10" fill="#555">${esc(label)}</text>`;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/**
 * ドメインごとの出題比率(DOMAIN_RATIO)を維持したまま、指定数の問題をランダムに抽出する。
 * 最大剰余法で端数を配分し、各ドメインのプール数を超えないようにする。
 * 戻り値はQUESTIONS_JAへのインデックス配列。
 */
function selectExamQuestions(count) {
  const byDomain = {};
  for (const domain of Object.keys(DOMAIN_RATIO)) {
    byDomain[domain] = shuffle(
      QUESTIONS_JA.map((q, i) => i).filter(i => QUESTIONS_JA[i].domain === domain)
    );
  }

  const ratioSum = Object.values(DOMAIN_RATIO).reduce((a, b) => a + b, 0);
  const baseCounts = {};
  const remainders = {};
  let allocated = 0;
  for (const [domain, ratio] of Object.entries(DOMAIN_RATIO)) {
    const poolSize = byDomain[domain].length;
    const ideal = count * (ratio / ratioSum);
    let base = Math.min(Math.floor(ideal), poolSize);
    baseCounts[domain] = base;
    remainders[domain] = ideal - base;
    allocated += base;
  }

  let remaining = count - allocated;
  const byRemainderDesc = Object.keys(DOMAIN_RATIO).sort((a, b) => remainders[b] - remainders[a]);
  for (const domain of byRemainderDesc) {
    if (remaining <= 0) break;
    if (baseCounts[domain] < byDomain[domain].length) {
      baseCounts[domain]++;
      remaining--;
    }
  }
  // プール枯渇などで端数が余った場合は、余力のあるドメインに順番に割り当てる
  while (remaining > 0) {
    let progressed = false;
    for (const domain of Object.keys(DOMAIN_RATIO)) {
      if (remaining <= 0) break;
      if (baseCounts[domain] < byDomain[domain].length) {
        baseCounts[domain]++;
        remaining--;
        progressed = true;
      }
    }
    if (!progressed) break;
  }

  let result = [];
  for (const [domain, n] of Object.entries(baseCounts)) {
    result = result.concat(byDomain[domain].slice(0, n));
  }
  return shuffle(result);
}

function startTimer() {
  stopTimer();
  remainingSeconds = TIME_LIMIT_SECONDS;
  updateTimerLabel();
  timerHandle = setInterval(() => {
    remainingSeconds--;
    updateTimerLabel();
    if (remainingSeconds <= 0) {
      stopTimer();
      handleTimeUp();
    }
  }, 1000);
}

function stopTimer() {
  if (timerHandle) {
    clearInterval(timerHandle);
    timerHandle = null;
  }
}

function updateTimerLabel() {
  const m = String(Math.max(remainingSeconds, 0) / 60 | 0).padStart(2, '0');
  const s = String(Math.max(remainingSeconds, 0) % 60).padStart(2, '0');
  timerLabelEl.textContent = t().timer(m, s);
  timerLabelEl.style.color = remainingSeconds <= 300 ? '#ea4335' : '';
}

function handleTimeUp() {
  if (examFinished) return;

  // 未回答分（現在の問題が未回答ならそれ以降）を不正解として集計する
  const startUnanswered = answered ? currentIndex + 1 : currentIndex;
  for (let i = startUnanswered; i < session.length; i++) {
    const idx = session[i];
    const domain = QUESTIONS_JA[idx].domain;
    domainStats[domain] = domainStats[domain] || { correct: 0, total: 0 };
    domainStats[domain].total++;
    missed.push(idx);
  }

  bringWindowToFront();
  alert(t().timeUpAlert);
  showResult();
}

function bringWindowToFront() {
  // ブラウザの制約上、他アプリの最前面には出せないが、可能な範囲でウィンドウにフォーカスを戻す
  window.focus();
  const originalTitle = t().pageTitle;
  let flashCount = 0;
  const flashHandle = setInterval(() => {
    document.title = (flashCount % 2 === 0) ? t().titleFlash + originalTitle : originalTitle;
    flashCount++;
    if (flashCount > 6) {
      clearInterval(flashHandle);
      document.title = originalTitle;
    }
  }, 500);
}

    const checkedAttr = pos === selectedPos ? 'checked' : '';
    const disabledAttr = answered ? 'disabled' : '';
    label.innerHTML = `<input type="radio" name="choice" value="${pos}" ${checkedAttr} ${disabledAttr}> ${letters[pos]}. ${esc(q.choices[origIndex])}`;
    choicesEl.appendChild(label);
  });
}

// 回答解説（ヘッダー・解説文・図解キャプション）は、問題文の表示言語(LANG)に関わらず常に日本語で表示する。
// 専門用語（MCP, hooksなど）は元の日本語解説内で英語表記のまま残る。
function buildFeedbackHtml(isCorrect, correctLetter) {
  const qJA = QUESTIONS_JA[session[currentIndex]];
  const caption = diagramCaptions()[qJA.diagram] || '';
  const diagramNote = caption
    ? `<div style="margin-top:8px; padding-top:8px; border-top:1px dashed #bbb; font-size:0.9em;">${esc(STRINGS.ja.diagramNote(caption))}</div>`
    : '';
  const header = isCorrect ? STRINGS.ja.correctHeader : STRINGS.ja.wrongHeader(correctLetter);
  return `<strong>${esc(header)}</strong><br>${esc(qJA.explanation)}${diagramNote}`;
}

function renderFeedback() {
  if (!answered) {
    feedbackEl.className = 'feedback hidden';
    feedbackEl.innerHTML = '';
    return;
  }
  const isCorrect = selectedPos === currentCorrectPos;
  const correctLetter = ['A', 'B', 'C', 'D'][currentCorrectPos];
  feedbackEl.className = isCorrect ? 'feedback correct' : 'feedback wrong';
  feedbackEl.innerHTML = buildFeedbackHtml(isCorrect, correctLetter);
}

// 回答済み、またはヒントボタンが押された場合にのみ図解を表示する。
// それ以外は「ヒントを見る」ボタンだけを出しておく（図解があるドメインのみ）。
function updateDiagramVisibility() {
  const qJA = QUESTIONS_JA[session[currentIndex]];
  const hasDiagram = !!(qJA.diagram && DIAGRAM_BUILDERS[qJA.diagram]);

  if (answered || hintShown) {
    hintBtn.classList.add('hidden');
    if (hasDiagram) {
      renderDiagram(qJA.diagram);
    } else {
      diagramBoxEl.classList.add('hidden');
      diagramBoxEl.innerHTML = '';
    }
  } else {
    diagramBoxEl.classList.add('hidden');
    diagramBoxEl.innerHTML = '';
    hintBtn.classList.toggle('hidden', !hasDiagram);
  }
}

hintBtn.addEventListener('click', () => {
  if (examFinished || answered) return;
  hintShown = true;
  updateDiagramVisibility();
});

function showQuestion(preserveState) {
  const idx = session[currentIndex];
  const qJA = QUESTIONS_JA[idx];
  const q = getQ(idx);

  document.getElementById('progress').textContent = t().progress(currentIndex + 1, session.length);
  document.getElementById('domainLabel').textContent = t().domainPrefix + domainLabel(qJA.domain);
  document.getElementById('qtext').textContent = `${currentIndex + 1}. ${q.text}`;

  if (!preserveState) {
    answered = false;
    selectedPos = -1;
    hintShown = false;
    currentOrder = shuffle([0, 1, 2, 3]);
    currentCorrectPos = currentOrder.indexOf(qJA.correct);
  }

  renderChoices();
  renderFeedback();
  updateDiagramVisibility();
  answerBtn.disabled = answered;
  nextBtn.disabled = !answered;
}

answerBtn.addEventListener('click', () => {
  if (answered || examFinished) return;
  const selectedInput = document.querySelector('input[name="choice"]:checked');
  if (!selectedInput) {
    alert(t().selectOneAlert);
    return;
  }
  answered = true;
  selectedPos = parseInt(selectedInput.value, 10);
  const idx = session[currentIndex];
  const domain = QUESTIONS_JA[idx].domain;

  domainStats[domain] = domainStats[domain] || { correct: 0, total: 0 };
  domainStats[domain].total++;

  const isCorrect = selectedPos === currentCorrectPos;
  if (isCorrect) {
    correctCount++;
    domainStats[domain].correct++;
  } else {
    missed.push(idx);
  }

  renderChoices();
  renderFeedback();
  updateDiagramVisibility();

  answerBtn.disabled = true;
  nextBtn.disabled = false;
});

nextBtn.addEventListener('click', () => {
  if (examFinished) return;
  currentIndex++;
  if (currentIndex >= session.length) {
    stopTimer();
    showResult();
  } else {
    showQuestion();
  }
});

function showResult(preserveState) {
  examFinished = true;
  stopTimer();
  questionCard.classList.add('hidden');
  resultCard.classList.remove('hidden');

  const total = session.length;
  const pct = total === 0 ? 0 : (100 * correctCount / total).toFixed(1);
  document.getElementById('resultSummary').textContent = t().resultSummary(correctCount, total, pct);

  const statsEl = document.getElementById('domainStats');
  let statsHtml = `<p><strong>${esc(t().domainStatsHeader)}</strong></p>`;
  for (const [domain, s] of Object.entries(domainStats)) {
    statsHtml += `<div>・${esc(domainLabel(domain))}: ${s.correct} / ${s.total}</div>`;
  }
  statsEl.innerHTML = statsHtml;

  const missedEl = document.getElementById('missedList');
  if (missed.length === 0) {
    missedEl.innerHTML = `<p><strong>${esc(t().allCorrect)}</strong></p>`;
  } else {
    let html = `<p><strong>${esc(t().missedHeader)}</strong></p>`;
    missed.forEach(idx => {
      const qJA = QUESTIONS_JA[idx];
      const q = getQ(idx);
      html += `<div class="item">${esc(q.text)}<br><span style="color:#34a853;">${esc(t().correctAnswerLabel)}${esc(q.choices[qJA.correct])}</span></div>`;
    });
    missedEl.innerHTML = html;
  }
}

document.getElementById('retryBtn').addEventListener('click', () => {
  resultCard.classList.add('hidden');
  startCard.classList.remove('hidden');
});

document.getElementById('langJaBtn').addEventListener('click', () => setLang('ja'));
document.getElementById('langEnBtn').addEventListener('click', () => setLang('en'));

applyStaticStrings();
</script>
</body>
</html>
